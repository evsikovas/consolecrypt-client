# Fixed root-reviewed ConsoleCrypt runtime policy. No protocol authority.
[Unit]
Requires=run-consolecrypt\x2dagent-volatile.mount user@10001.service
After=run-consolecrypt\x2dagent-volatile.mount user@10001.service
[Service]
RuntimeDirectoryPreserve=yes
ProtectHome=tmpfs
BindReadOnlyPaths=/run/user/10001
