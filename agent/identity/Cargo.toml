[package]
name = "cc-agent-identity-policy"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
owned-lifetime-protocol-proof = []

[dependencies]
cc-crypto-core = { path = "../../client/rust/crypto-core" }
cc-agent-node-wire = { path = "../../client/rust/agent-node-wire" }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
sha2 = "=0.11.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.29.0", features = ["serde"] }
zeroize = "=1.9.1"
subtle = "=2.6.1"
hex = "=0.4.3"

[target.'cfg(target_os = "linux")'.dependencies]
# Existing verified Agent-lock tuple; safe actual uname, no subprocess/unsafe.
rustix = { version = "=1.1.6", default-features = false, features = ["std", "system", "process", "fs"] }
getrandom = { version = "=0.4.3", default-features = false }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "limits"] }
libsqlite3-sys = { version = "=0.38.2", default-features = false, features = ["bundled"] }
fs4 = { version = "=1.1.0", default-features = false }

[patch.crates-io]
# Reviewed SQLite e5bf119 WAL-tail initialization backport; same crate version/API.
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }
