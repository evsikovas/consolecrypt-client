groups:
  - name: consolecrypt-node-health
    interval: 30s
    rules:
      - alert: ConsoleCryptScrapeUnavailable
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A configured exporter has not answered scrapes for five minutes
      - record: consolecrypt:monitoring_self_scrape_samples:rate5m
        expr: rate(prometheus_tsdb_head_samples_appended_total[5m])
