---
- name: Create separate monitoring service account
  ansible.builtin.user:
    name: cc-monitoring
    system: true
    create_home: false
    home: /nonexistent
    shell: /usr/sbin/nologin

- name: Create bounded-purpose configuration, data and download directories
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: directory
    owner: '{{ item.owner }}'
    group: '{{ item.owner }}'
    mode: '{{ item.mode }}'
  loop:
    - {path: /etc/consolecrypt-monitoring, owner: root, mode: '0755'}
    - {path: /opt/consolecrypt-monitoring, owner: root, mode: '0755'}
    - {path: /var/cache/consolecrypt-monitoring, owner: root, mode: '0755'}
    - {path: /srv/consolecrypt-monitoring/data, owner: cc-monitoring, mode: '0700'}
    - {path: /srv/consolecrypt-monitoring/config-backup, owner: root, mode: '0700'}

- name: Install fixed reviewed configuration backup helper
  ansible.builtin.copy:
    src: monitoring_backup.py
    dest: /opt/consolecrypt-monitoring/monitoring_backup.py
    owner: root
    group: root
    mode: '0644'
    follow: false

- name: Capture only the current explicit reviewed restore intent
  ansible.builtin.set_fact:
    cc_monitoring_backup_intent:
      version: 1
      config: '{{ cc_prometheus_config }}'
      rulesSha256: '{{ lookup("ansible.builtin.file", "rules.yml", lstrip=false, rstrip=false) | hash("sha256") }}'
      unitSha256: '{{ lookup("ansible.builtin.template", "prometheus.service.j2") | hash("sha256") }}'
  no_log: true

- name: Fetch exact upstream release with independently pinned SHA-256
  ansible.builtin.get_url:
    url: https://github.com/prometheus/prometheus/releases/download/v3.16.0/prometheus-3.16.0.linux-amd64.tar.gz
    dest: /var/cache/consolecrypt-monitoring/prometheus-3.16.0.linux-amd64.tar.gz
    checksum: sha256:68727009472a2c02e1ff7f062fd5b3e637285bffc8fc2d340c76fb449d6e0f34
    mode: '0644'
    validate_certs: true
    use_proxy: false
  register: cc_download

- name: Extract verified release including upstream LICENSE and NOTICE
  ansible.builtin.unarchive:
    src: /var/cache/consolecrypt-monitoring/prometheus-3.16.0.linux-amd64.tar.gz
    dest: /opt/consolecrypt-monitoring
    remote_src: true
    owner: root
    group: root
    creates: /opt/consolecrypt-monitoring/prometheus-3.16.0.linux-amd64/prometheus

- name: Install bounded monitoring rules
  ansible.builtin.copy:
    src: rules.yml
    dest: /etc/consolecrypt-monitoring/rules.yml
    owner: root
    group: root
    mode: '0644'
    backup: true
    validate: /opt/consolecrypt-monitoring/prometheus-3.16.0.linux-amd64/promtool check rules %s
  notify: Restart ConsoleCrypt Prometheus

- name: Validate and install explicitly reviewed scrape configuration
  ansible.builtin.copy:
    content: '{{ cc_prometheus_config | to_nice_json }}'
    dest: /etc/consolecrypt-monitoring/prometheus.yml
    owner: root
    group: root
    mode: '0644'
    backup: true
    validate: /opt/consolecrypt-monitoring/prometheus-3.16.0.linux-amd64/promtool check config %s
  notify: Restart ConsoleCrypt Prometheus

- name: Install loopback-only service with explicit receiver option
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/consolecrypt-prometheus.service
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: Restart ConsoleCrypt Prometheus

- name: Enable the separately approved monitoring service
  ansible.builtin.systemd_service:
    name: consolecrypt-prometheus
    daemon_reload: true
    enabled: true
    state: started

- name: Complete actual installation or configuration restart before backup
  ansible.builtin.meta: flush_handlers

- name: Observe actual loopback readiness before calling configuration a backup
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/-/ready
    method: GET
    status_code: 200
    use_proxy: false
    return_content: false
    timeout: 3
  register: cc_monitoring_ready
  until: cc_monitoring_ready.status | default(0) == 200
  retries: 15
  delay: 2

- name: Create and verify fixed configuration backup in one bounded remote operation
  ansible.builtin.command:
    argv:
      - '{{ cc_node_facts.ansible_facts.ansible_python.executable }}'
      - /opt/consolecrypt-monitoring/monitoring_backup.py
      - --create-reviewed-backup
    stdin: '{{ cc_monitoring_backup_intent | to_json }}'
  changed_when: true
  failed_when: false
  register: cc_monitoring_backup_result
  no_log: true

- name: Report only the closed configuration backup error category
  ansible.builtin.assert:
    that: cc_monitoring_backup_result.rc == 0
    fail_msg: 'Monitoring configuration backup refused (code {{ cc_monitoring_backup_result.rc | int }}); configuration and tool output remain private.'
