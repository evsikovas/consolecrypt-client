---
- name: Require explicit bounded Linux delivery intent
  ansible.builtin.assert:
    that:
      - cc_agent_install_operation in ['install', 'update', 'rollback', 'remove', 'status']
      - cc_agent_install_approved is boolean
      - cc_agent_install_start is boolean
      - cc_agent_install_metrics_runtime is boolean
      - cc_agent_install_metrics_buffer_mode in ['volatile', 'persistentNativeWal']
      - not cc_agent_install_metrics_runtime or (cc_agent_install_operation in ['install', 'update'] and cc_agent_install_approved and cc_agent_install_start)
      - cc_agent_install_operation == 'status' or cc_agent_install_approved
    fail_msg: Select an explicit signed install/update, known rollback or software-only remove. No data deletion is included.

- name: Require the preprovisioned static service account without creating a key
  ansible.builtin.getent:
    database: passwd
    key: consolecrypt-agent
  when: cc_agent_install_operation != 'status'

- name: Observe the exact existing product unit before changing installation inputs
  ansible.builtin.stat:
    path: /etc/systemd/system/consolecrypt-agent.service
    follow: false
    checksum_algorithm: sha256
  register: cc_agent_existing_unit

- name: Refuse unknown legacy unit replacement or drop in migration
  ansible.builtin.assert:
    that:
      - not cc_agent_existing_unit.stat.exists or (cc_agent_existing_unit.stat.isreg | default(false) and not (cc_agent_existing_unit.stat.islnk | default(true)) and cc_agent_existing_unit.stat.uid == 0 and cc_agent_existing_unit.stat.checksum == lookup('ansible.builtin.file', role_path + '/files/consolecrypt-agent-installed.service', lstrip=false, rstrip=false) | hash('sha256'))
    fail_msg: Existing units must be the exact fixed installer wrapper; migrate legacy or modified units explicitly.

- name: Refuse an interactive service login
  ansible.builtin.assert:
    that:
      - ansible_facts.getent_passwd['consolecrypt-agent'][-1] in ['/usr/sbin/nologin', '/bin/false']
      - ansible_facts.getent_passwd['consolecrypt-agent'][1] | int > 0
      - ansible_facts.getent_passwd['consolecrypt-agent'][2] | int > 0
  when: cc_agent_install_operation != 'status'

- name: Require explicit dedicated collector account numbers without creating or repairing an account
  ansible.builtin.assert:
    that:
      - cc_agent_install_service_uid is integer and cc_agent_install_service_uid > 0
      - cc_agent_install_service_gid is integer and cc_agent_install_service_gid > 0
      - ansible_facts.getent_passwd['consolecrypt-agent'][1] | int == cc_agent_install_service_uid
      - ansible_facts.getent_passwd['consolecrypt-agent'][2] | int == cc_agent_install_service_gid
      - ansible_facts.getent_passwd['consolecrypt-agent'][-2] == '/var/lib/consolecrypt-agent'
      - ansible_facts.getent_passwd['consolecrypt-agent'][-1] == '/usr/sbin/nologin'
  when: cc_agent_install_metrics_runtime

- name: Require explicit controller artifacts only for signed install or update
  ansible.builtin.assert:
    that:
      - cc_agent_release_artifact is string and cc_agent_release_artifact is match('^/[^\n\r]+$')
      - cc_agent_release_manifest is string and cc_agent_release_manifest is match('^/[^\n\r]+$')
  when: cc_agent_install_operation in ['install', 'update']

- name: Inspect fixed inert software and candidate parents without repairing paths
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
    get_checksum: false
  loop:
    - /usr/local/libexec/consolecrypt-agent-install
    - /var/cache/consolecrypt-agent
    - /opt/consolecrypt-agent-install
  register: cc_agent_parent_observations
  when: cc_agent_install_operation != 'status'

- name: Refuse linked foreign or writable existing software parents
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isdir | default(false) and not (item.stat.islnk | default(true)) and item.stat.uid == 0 and item.stat.mode == '0755')
  loop: '{{ cc_agent_parent_observations.results | default([]) }}'
  when: cc_agent_install_operation != 'status'

- name: Create only absent fixed root controlled inert parents
  ansible.builtin.file:
    path: '{{ item.item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: '{{ cc_agent_parent_observations.results | default([]) }}'
  when:
    - cc_agent_install_operation != 'status'
    - not item.stat.exists

- name: Install only the existing verifier adapters and fixed delivery wrapper
  ansible.builtin.copy:
    src: '{{ role_path }}/../../{{ item }}'
    dest: '/usr/local/libexec/consolecrypt-agent-install/{{ item }}'
    owner: root
    group: root
    mode: '0644'
    follow: false
  loop: [install_linux.py, installed_runtime_policy.py, release_platforms.py, collector_provision.py, collector_namespace_probe.py, collector_disk_namespace_probe.py, stage.py, release_verifier.py, notice_inventory.py, prototype_package.py, package_wheel.py]
  when: cc_agent_install_operation != 'status'

- name: Copy the signed candidate without executing or trusting it yet
  ansible.builtin.copy:
    src: '{{ item.source }}'
    dest: '{{ item.destination }}'
    owner: root
    group: root
    mode: '0644'
    follow: false
  loop:
    - {source: '{{ cc_agent_release_artifact }}', destination: /var/cache/consolecrypt-agent/candidate.zip}
    - {source: '{{ cc_agent_release_manifest }}', destination: /var/cache/consolecrypt-agent/candidate-release.json}
  when: cc_agent_install_operation in ['install', 'update']

- name: Install exact original unit bytes for the fixed systemd observer
  ansible.builtin.copy:
    src: consolecrypt-agent-installed.service
    dest: /usr/local/libexec/consolecrypt-agent-install/consolecrypt-agent-installed.service
    owner: root
    group: root
    mode: '0644'
    follow: false
  when: cc_agent_install_operation != 'status'

- name: Inspect every fixed root profile ancestor without following links
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
    get_checksum: false
  loop: ['/', '/etc', '/etc/consolecrypt-agent']
  register: cc_agent_collector_profile_parents
  when: cc_agent_install_metrics_runtime

- name: Refuse missing linked foreign or writable profile ancestors
  ansible.builtin.assert:
    that:
      - item.stat.exists and item.stat.isdir | default(false)
      - not (item.stat.islnk | default(true))
      - item.stat.uid == 0
      - item.stat.mode in ['0700', '0750', '0755']
    fail_msg: Provision the fixed root configuration directory separately; no path repair is implicit.
  loop: '{{ cc_agent_collector_profile_parents.results | default([]) }}'
  when: cc_agent_install_metrics_runtime

- name: Capture the exact explicit non-authority collector profile bytes
  ansible.builtin.set_fact:
    cc_agent_collector_profile_text: '{{ {"format": ("cc-agent-installed-disk-collector-profile/v1" if cc_agent_install_metrics_buffer_mode == "persistentNativeWal" else "cc-agent-installed-collector-profile/v1"), "uid": cc_agent_install_service_uid, "gid": cc_agent_install_service_gid} | to_json }}{{ "\n" }}'
  when: cc_agent_install_metrics_runtime

- name: Inspect the fixed root profile without following links or repairing unknown input
  ansible.builtin.stat:
    path: /etc/consolecrypt-agent/collector-runtime.json
    follow: false
    checksum_algorithm: sha256
  register: cc_agent_collector_profile_before
  when: cc_agent_install_metrics_runtime

- name: Refuse a foreign or changed existing collector profile
  ansible.builtin.assert:
    that:
      - not cc_agent_collector_profile_before.stat.exists or (cc_agent_collector_profile_before.stat.isreg | default(false) and not (cc_agent_collector_profile_before.stat.islnk | default(true)) and cc_agent_collector_profile_before.stat.uid == 0 and cc_agent_collector_profile_before.stat.nlink == 1 and cc_agent_collector_profile_before.stat.mode == '0600' and cc_agent_collector_profile_before.stat.checksum == (cc_agent_collector_profile_text | hash('sha256')))
    fail_msg: Existing runtime profile needs explicit administrator reconciliation; this role never changes account ownership or adopts unknown input.
  when: cc_agent_install_metrics_runtime

- name: Publish only an absent explicitly selected root collector profile
  ansible.builtin.copy:
    content: '{{ cc_agent_collector_profile_text }}'
    dest: /etc/consolecrypt-agent/collector-runtime.json
    owner: root
    group: root
    mode: '0600'
    follow: false
    force: false
  when:
    - cc_agent_install_metrics_runtime
    - not cc_agent_collector_profile_before.stat.exists

- name: Perform one locked signed transaction with real original worker join
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -I
      - -B
      - /usr/local/libexec/consolecrypt-agent-install/install_linux.py
      - '{{ cc_agent_install_operation }}'
      - '{{ "start-collector" if cc_agent_install_metrics_runtime else ("start" if cc_agent_install_start else "stage-only") }}'
  register: cc_agent_delivery_actual
  timeout: 240
  changed_when: cc_agent_install_operation != 'status'
  when: not ansible_check_mode

- name: Expose actual selection and process observations without minting runtime version
  ansible.builtin.set_fact:
    cc_agent_delivery_observation: '{{ cc_agent_delivery_actual.stdout | from_json }}'
  when: not ansible_check_mode
