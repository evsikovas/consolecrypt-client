---
- name: Require an explicit identity provisioning switch
  ansible.builtin.assert:
    that: [cc_agent_identity_provision is boolean]

- name: Provision an explicitly requested node-local identity
  when: cc_agent_identity_provision
  block:
    - name: Validate public provisioning inputs and per-host ID mapping
      ansible.builtin.assert:
        that:
          - cc_agent_identity_binary is string and cc_agent_identity_binary is match('^/[^\n\r]+$')
          - cc_agent_identity_binary_sha256 is match('^[0-9a-f]{64}$')
          - cc_agent_identity_state_dir is string and cc_agent_identity_state_dir is match('^/[^\n\r]+/[^/\n\r]+$')
          - "'..' not in cc_agent_identity_state_dir.split('/')"
          - cc_agent_identity_agent_id is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
          - cc_agent_identity_agent_id != '00000000-0000-0000-0000-000000000000'
          - cc_agent_identity_fleet_ids is mapping
          - cc_agent_identity_fleet_ids | length == 0 or cc_agent_identity_fleet_ids[inventory_hostname] == cc_agent_identity_agent_id
          - ansible_play_hosts_all | length == 1 or ansible_play_hosts_all | difference(cc_agent_identity_fleet_ids.keys() | list) | length == 0
          - cc_agent_identity_fleet_ids.values() | list | unique | length == cc_agent_identity_fleet_ids | length
        fail_msg: Provisioning needs an already verified binary, private target path and a unique explicit Agent ID for each host.

    - name: Inspect the installed verifier without following a symlink
      ansible.builtin.stat:
        path: '{{ cc_agent_identity_binary }}'
        follow: false
        checksum_algorithm: sha256
      register: _cc_agent_identity_binary_stat

    - name: Require the exact already verified installed binary
      ansible.builtin.assert:
        that:
          - _cc_agent_identity_binary_stat.stat.isreg | default(false)
          - not _cc_agent_identity_binary_stat.stat.islnk | default(true)
          - _cc_agent_identity_binary_stat.stat.checksum | default('') == cc_agent_identity_binary_sha256
        fail_msg: The role never downloads or substitutes an identity binary.

    - name: Inspect the existing private parent without creating an identity directory
      ansible.builtin.stat:
        path: '{{ cc_agent_identity_state_dir | dirname }}'
        follow: false
        get_checksum: false
      register: _cc_agent_identity_parent

    - name: Require a separately provisioned physical private parent
      ansible.builtin.assert:
        that:
          - _cc_agent_identity_parent.stat.isdir | default(false)
          - not _cc_agent_identity_parent.stat.islnk | default(true)
          - _cc_agent_identity_parent.stat.mode | default('') == '0700'
        fail_msg: Provision a physical 0700 parent as the intended service account; this role does not create accounts or repair paths.

    - name: Observe whether identity state already exists
      ansible.builtin.stat:
        path: '{{ cc_agent_identity_state_dir }}'
        follow: false
        get_checksum: false
      register: _cc_agent_identity_before

    - name: Expose a provisioning plan without registration or scopes
      ansible.builtin.set_fact:
        cc_agent_identity_plan:
          agent_id: '{{ cc_agent_identity_agent_id }}'
          would_generate_local_key: '{{ not _cc_agent_identity_before.stat.exists }}'
          enrolls_agent: false
          grants_scopes: false

    - name: Generate a unique local key or validate the existing matching key
      ansible.builtin.command:
        argv:
          - '{{ cc_agent_identity_binary }}'
          - provision-node
          - --state-dir
          - '{{ cc_agent_identity_state_dir }}'
          - --agent-id
          - '{{ cc_agent_identity_agent_id }}'
      register: _cc_agent_identity_hello
      changed_when: not _cc_agent_identity_before.stat.exists
      no_log: true
      when: not ansible_check_mode

    - name: Expose public hello only
      ansible.builtin.set_fact:
        cc_agent_node_public: '{{ _cc_agent_identity_hello.stdout | from_json }}'
      no_log: true
      when: not ansible_check_mode

    - name: Validate the public identity result without issuing authority
      ansible.builtin.assert:
        that:
          - cc_agent_node_public.keys() | list | sort == ['agentId', 'format', 'keyEpoch', 'keyFingerprint', 'publicKey']
          - cc_agent_node_public.format == 1
          - cc_agent_node_public.agentId == cc_agent_identity_agent_id
          - cc_agent_node_public.keyEpoch == 1
          - cc_agent_node_public.publicKey is match('^[0-9a-f]{64}$')
          - cc_agent_node_public.keyFingerprint is match('^[0-9a-f]{64}$')
        fail_msg: Only a public hello is valid; enrollment and scopes require a separate trusted ceremony.
      when: not ansible_check_mode
