---
- name: Require explicit offline managed-exporter preparation inputs
  ansible.builtin.assert:
    that:
      - cc_managed_exporter_prepare is sameas true
      - cc_managed_exporter_bundle_dir is match('^/')
      - cc_managed_exporter_worker_sha256 is match('^[0-9a-f]{64}$')
      - cc_managed_exporter_platform in ['linux-x86_64', 'linux-aarch64']
      - cc_managed_exporter_host_id is match('^[0-9a-f-]{36}$')
      - cc_managed_exporter_agent_id is match('^[0-9a-f-]{36}$')
      - cc_managed_exporter_max_seconds | int >= 30
      - cc_managed_exporter_max_seconds | int <= 300
    fail_msg: 'Requires existing enrolled Node, reviewed normal release inputs and explicit administrator preparation.'

- name: Bound local inventory before transfer
  ansible.builtin.stat:
    path: '{{ cc_managed_exporter_bundle_dir }}/notices/inventory.json'
    follow: false
  delegate_to: localhost
  become: false
  register: cc_exporter_local_inventory

- name: Require one bounded regular inventory
  ansible.builtin.assert:
    that:
      - cc_exporter_local_inventory.stat.isreg | default(false)
      - not (cc_exporter_local_inventory.stat.islnk | default(true))
      - cc_exporter_local_inventory.stat.size | int <= 262144

- name: Select only listed content-addressed full notice paths
  ansible.builtin.set_fact:
    cc_exporter_notice_paths: '{{ (lookup("ansible.builtin.file", cc_managed_exporter_bundle_dir + "/notices/inventory.json", rstrip=false) | from_json).components | map(attribute="notices", default=[]) | flatten | map(attribute="package_path") | unique | list }}'

- name: Require bounded closed material names before any remote publication
  ansible.builtin.assert:
    that:
      - cc_exporter_notice_paths | length >= 1
      - cc_exporter_notice_paths | length <= 128
      - item is match('^notices/text/[0-9a-f]{64}\.txt$')
  loop: '{{ cc_exporter_notice_paths }}'

- name: Bound all selected offline transfer inputs
  ansible.builtin.stat:
    path: '{{ cc_managed_exporter_bundle_dir }}/{{ item }}'
    follow: false
  delegate_to: localhost
  become: false
  loop: '{{ ["official-archive.tar.gz"] + cc_exporter_notice_paths }}'
  register: cc_exporter_local_files

- name: Refuse missing, linked or oversized offline transfer inputs
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(true))
      - item.stat.size | int > 0
      - item.stat.size | int <= (67108864 if item.item == 'official-archive.tar.gz' else 131072)
  loop: '{{ cc_exporter_local_files.results }}'

- name: Prepare one bounded exporter without granting an operation
  become: true
  block:
    - name: Allocate private temporary preparation directory
      ansible.builtin.tempfile:
        state: directory
        prefix: cc-managed-exporter-
      register: cc_exporter_temp

    - name: Copy fixed preparation source and existing inventory codec
      ansible.builtin.copy:
        src: '{{ item.src }}'
        dest: '{{ cc_exporter_temp.path }}/{{ item.dest }}'
        owner: root
        group: root
        mode: '0644'
      loop:
        - {src: '{{ role_path }}/../../managed_exporter/preflight_host.py', dest: preflight_host.py}
        - {src: '{{ role_path }}/../../managed_exporter/prepare_local.py', dest: prepare_local.py}
        - {src: '{{ role_path }}/../../notice_inventory.py', dest: notice_inventory.py}

    - name: Refuse conflicts and verify the existing normal installed Agent
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - -B
          - '{{ cc_exporter_temp.path }}/preflight_host.py'
          - --agent-id
          - '{{ cc_managed_exporter_agent_id }}'
          - --worker-sha256
          - '{{ cc_managed_exporter_worker_sha256 }}'
          - --adapter-sha256
          - '{{ lookup("ansible.builtin.file", role_path + "/../consolecrypt_agent_enrollment/files/enrollment-worker", rstrip=false) | hash("sha256") }}'
      changed_when: false
      register: cc_exporter_host

    - name: Retain original host prerequisite observations
      ansible.builtin.set_fact:
        cc_exporter_existing: '{{ cc_exporter_host.stdout | from_json }}'

    - name: Copy exact offline official archive
      ansible.builtin.copy:
        src: '{{ cc_managed_exporter_bundle_dir }}/official-archive.tar.gz'
        dest: '{{ cc_exporter_temp.path }}/official-archive.tar.gz'
        owner: root
        group: root
        mode: '0644'

    - name: Create private temporary material directories
      ansible.builtin.file:
        path: '{{ cc_exporter_temp.path }}/notices/text'
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy only bounded listed material files and their inventory
      ansible.builtin.copy:
        src: '{{ cc_managed_exporter_bundle_dir }}/{{ item }}'
        dest: '{{ cc_exporter_temp.path }}/{{ item }}'
        owner: root
        group: root
        mode: '0644'
      loop: '{{ ["notices/inventory.json"] + cc_exporter_notice_paths }}'

    - name: Independently validate archive, ELF and material bytes on the target
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - -B
          - '{{ cc_exporter_temp.path }}/prepare_local.py'
          - --archive
          - '{{ cc_exporter_temp.path }}/official-archive.tar.gz'
          - --materials
          - '{{ cc_exporter_temp.path }}'
          - --worker
          - '{{ cc_exporter_existing.worker }}'
          - --output
          - '{{ cc_exporter_temp.path }}/verified'
          - --platform
          - '{{ cc_managed_exporter_platform }}'
          - --host-id
          - '{{ cc_managed_exporter_host_id }}'
          - --agent-id
          - '{{ cc_managed_exporter_agent_id }}'
          - --max-seconds
          - '{{ cc_managed_exporter_max_seconds | string }}'
      changed_when: true

    - name: Create disjoint administrator-owned executable and material root
      ansible.builtin.file:
        path: /opt/consolecrypt-agent-managed-exporter
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Publish verified normal exporter only in the disjoint managed tree
      ansible.builtin.copy:
        src: '{{ cc_exporter_temp.path }}/verified/node_exporter'
        dest: /opt/consolecrypt-agent-managed-exporter/node_exporter
        remote_src: true
        owner: root
        group: root
        mode: '0755'
        force: false

    - name: Publish verified complete material files
      ansible.builtin.copy:
        src: '{{ cc_exporter_temp.path }}/verified/notices/'
        dest: /opt/consolecrypt-agent-managed-exporter/notices/
        remote_src: true
        owner: root
        group: root
        mode: '0644'
        directory_mode: '0755'
        force: false

    - name: Publish immutable root policy and actual installed worker digest
      ansible.builtin.copy:
        src: '{{ cc_exporter_temp.path }}/verified/managed-node-exporter.json'
        dest: /etc/consolecrypt-agent/managed-node-exporter.json
        remote_src: true
        owner: root
        group: root
        mode: '0644'
        force: false

    - name: Create disjoint trusted bridge directory
      ansible.builtin.file:
        path: /usr/local/libexec/consolecrypt-agent-managed-exporter
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install fixed byte bridge
      ansible.builtin.copy:
        src: '{{ role_path }}/../../managed_exporter/enrollment_bridge.py'
        dest: /usr/local/libexec/consolecrypt-agent-managed-exporter/enrollment_bridge.py
        owner: root
        group: root
        mode: '0644'
        force: false

    - name: Install bounded original control connection units
      ansible.builtin.copy:
        src: '{{ role_path }}/../../managed_exporter/{{ item }}'
        dest: '/etc/systemd/system/{{ item }}'
        owner: root
        group: root
        mode: '0644'
        force: false
      loop:
        - consolecrypt-agent-managed-enroll.socket
        - consolecrypt-agent-managed-enroll@.service

    - name: Prepare private runtime directory across reboot
      ansible.builtin.copy:
        dest: /etc/tmpfiles.d/consolecrypt-agent-managed-exporter.conf
        content: "d /run/consolecrypt-agent/managed-exporter 0700 {{ cc_exporter_existing.serviceUid }} {{ cc_exporter_existing.serviceGid }} -\n"
        owner: root
        group: root
        mode: '0644'
        force: false

    - name: Create runtime directory from only this explicit tmpfiles input
      ansible.builtin.command:
        argv: [/usr/bin/systemd-tmpfiles, --create, /etc/tmpfiles.d/consolecrypt-agent-managed-exporter.conf]
      changed_when: true

    - name: Enable fixed resource-bounded control listener
      ansible.builtin.systemd_service:
        name: consolecrypt-agent-managed-enroll.socket
        daemon_reload: true
        enabled: true
        state: started

    - name: Read back installed bridge digest
      ansible.builtin.stat:
        path: /usr/local/libexec/consolecrypt-agent-managed-exporter/enrollment_bridge.py
        checksum_algorithm: sha256
        get_checksum: true
      register: cc_exporter_bridge

    - name: Install exact selected original role adapter with optional fixed transport
      ansible.builtin.copy:
        src: '{{ role_path }}/../consolecrypt_agent_enrollment/files/enrollment-worker'
        dest: /usr/libexec/consolecrypt-agent/enrollment-worker
        owner: root
        group: root
        mode: '0755'

    - name: Publish opt-in last after real listener setup
      ansible.builtin.copy:
        dest: /etc/consolecrypt-agent/managed-exporter-runtime.json
        content: '{{ {"format":"cc-agent-managed-exporter-control/v1", "serviceUid":cc_exporter_existing.serviceUid, "serviceGid":cc_exporter_existing.serviceGid, "bridgeSha256":cc_exporter_bridge.stat.checksum} | to_json }}'
        owner: root
        group: root
        mode: '0644'
        force: false

  always:
    - name: Remove only this operation original temporary preparation directory
      ansible.builtin.file:
        path: '{{ cc_exporter_temp.path }}'
        state: absent
      when: cc_exporter_temp is defined and cc_exporter_temp.path is defined
