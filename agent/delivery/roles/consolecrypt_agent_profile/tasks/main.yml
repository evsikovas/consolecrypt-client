---
- name: Require explicit public manifest and controller artifact policy
  ansible.builtin.assert:
    that:
      - cc_agent_profile_manifest is mapping
      - cc_agent_profile_manifest | length > 0
      - cc_agent_profile_fleet is sequence
      - cc_agent_profile_write is boolean
      - not cc_agent_profile_write or (cc_agent_profile_output_root is string and cc_agent_profile_output_root is match('^/[^\n\r]+$'))
      - ansible_play_hosts_all | length == 1 or cc_agent_profile_fleet | length >= ansible_play_hosts_all | length
    fail_msg: Provide a reviewed public profile; multi-host plays require the complete fleet for unique identity validation.

- name: Validate and render through the shared ConsoleCrypt profile model
  ansible.builtin.command:
    argv:
      - '{{ cc_agent_profile_python }}'
      - -I
      - -B
      - '{{ cc_agent_profile_renderer }}'
    stdin: '{{ {"manifest": cc_agent_profile_manifest, "fleet": cc_agent_profile_fleet} | to_json }}'
    stdin_add_newline: false
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: _cc_agent_profile_render
  no_log: true

- name: Expose reviewable configuration and plan without applying services
  ansible.builtin.set_fact:
    cc_agent_profile_artifacts: '{{ _cc_agent_profile_render.stdout | from_json }}'
  no_log: true

- name: Select a content-addressed controller artifact directory
  ansible.builtin.set_fact:
    cc_agent_profile_artifact_dir: '{{ cc_agent_profile_output_root }}/{{ cc_agent_profile_artifacts.metadata.profile_digest }}'
  when: cc_agent_profile_write

- name: Create the explicitly requested controller artifact directory
  ansible.builtin.file:
    path: '{{ cc_agent_profile_artifact_dir }}'
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
  when: cc_agent_profile_write

- name: Write deterministic public profile and review plan
  ansible.builtin.copy:
    content: '{{ item.value | to_nice_json }}'
    dest: '{{ cc_agent_profile_artifact_dir }}/{{ item.name }}.json'
    mode: '0600'
  loop:
    - {name: profile, value: '{{ cc_agent_profile_artifacts.profile }}'}
    - {name: plan, value: '{{ cc_agent_profile_artifacts.plan }}'}
  loop_control:
    label: '{{ item.name }}'
  delegate_to: localhost
  become: false
  when: cc_agent_profile_write

- name: Write Agent runtime configuration only when an Agent is requested
  ansible.builtin.copy:
    content: '{{ cc_agent_profile_artifacts.runtime | to_nice_json }}'
    dest: '{{ cc_agent_profile_artifact_dir }}/runtime.json'
    mode: '0600'
  delegate_to: localhost
  become: false
  when:
    - cc_agent_profile_write
    - cc_agent_profile_artifacts.runtime is not none

- name: Write collector configuration only for explicit pull or remote-write modes
  ansible.builtin.copy:
    content: '{{ cc_agent_profile_artifacts.collector | to_nice_json }}'
    dest: '{{ cc_agent_profile_artifact_dir }}/collector.json'
    mode: '0600'
  delegate_to: localhost
  become: false
  when:
    - cc_agent_profile_write
    - cc_agent_profile_artifacts.collector is not none
