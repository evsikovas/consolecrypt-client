---
- name: Require explicit outbound infrastructure intent
  ansible.builtin.assert:
    that:
      - cc_agent_outbound_control_enabled is boolean
      - cc_agent_outbound_control_approved is boolean
      - cc_agent_outbound_control_start is boolean
      - not cc_agent_outbound_control_enabled or cc_agent_outbound_control_approved
      - not cc_agent_outbound_control_start or cc_agent_outbound_control_enabled

- name: Prepare only the reviewed fixed outbound service
  when: cc_agent_outbound_control_enabled
  block:
    - name: Require supported explicit static service identity and numeric IPv4 egress
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu' and ansible_distribution_version == '24.04'
          - cc_agent_outbound_control_service_uid is integer and cc_agent_outbound_control_service_uid > 0
          - cc_agent_outbound_control_service_gid is integer and cc_agent_outbound_control_service_gid > 0
          - cc_agent_outbound_control_relay_ip is string
          - cc_agent_outbound_control_relay_ip is match('^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$')
          - cc_agent_outbound_control_relay_ip.split('.') | map('int') | max <= 255
          - cc_agent_outbound_control_relay_ip not in ['0.0.0.0', '255.255.255.255']

    - name: Observe actual preprovisioned service NSS identity
      ansible.builtin.getent:
        database: passwd
        key: consolecrypt-agent

    - name: Require noninteractive service Runas identity not the SSH login operator
      ansible.builtin.assert:
        that:
          - ansible_facts.getent_passwd['consolecrypt-agent'][1] | int == cc_agent_outbound_control_service_uid
          - ansible_facts.getent_passwd['consolecrypt-agent'][2] | int == cc_agent_outbound_control_service_gid
          - ansible_facts.getent_passwd['consolecrypt-agent'][-2] == '/var/lib/consolecrypt-agent'
          - ansible_facts.getent_passwd['consolecrypt-agent'][-1] in ['/usr/sbin/nologin', '/sbin/nologin']

    - name: Inspect existing root public prerequisites without reading credentials
      ansible.builtin.stat:
        path: '{{ item }}'
        follow: false
        checksum_algorithm: sha256
      loop:
        - /etc/consolecrypt-agent/tunnel-transport.json
        - /etc/consolecrypt-agent/tunnel-relay-ca.pem
        - /etc/consolecrypt-agent/enrollment-control.json
        - /usr/libexec/consolecrypt-agent/enrollment-role-check
        - /usr/bin/python3.12
      register: _cc_outbound_public

    - name: Require regular root-owned single-link reviewed prerequisites
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(true))
          - item.stat.uid == 0 and item.stat.nlink == 1
          - item.stat.mode in ['0644', '0755']
      loop: '{{ _cc_outbound_public.results }}'

    - name: Read only the public root transport descriptor
      ansible.builtin.slurp:
        src: /etc/consolecrypt-agent/tunnel-transport.json
      register: _cc_outbound_transport

    - name: Bind service egress to the exact existing root-installed dial IP
      ansible.builtin.assert:
        that:
          - (_cc_outbound_transport.content | b64decode | from_json).format == 'cc-agent-installed-tunnel-transport/v1'
          - (_cc_outbound_transport.content | b64decode | from_json).relayDialIp == cc_agent_outbound_control_relay_ip

    - name: Require actual maintained SSH role and exclusive effective Runas policy
      ansible.builtin.command:
        argv: [/usr/bin/python3.12, -I, -B, /usr/libexec/consolecrypt-agent/enrollment-role-check, --live-check]
      changed_when: false

    - name: Require selected package runtime pin to match the actual target Host interpreter
      ansible.builtin.command:
        argv: [/usr/bin/python3.12, -I, -B, /usr/libexec/consolecrypt-agent/enrollment-role-check, --tunnel-runtime-check]
      changed_when: false

    - name: Observe actual service-owned Node and transport directories
      ansible.builtin.stat:
        path: '{{ item }}'
        follow: false
        get_checksum: false
      loop:
        - /var/lib/consolecrypt-agent/identity/node
        - /var/lib/consolecrypt-agent/identity/sqlite
        - /var/lib/consolecrypt-agent/checkpoints/enrollment
        - /var/lib/consolecrypt-agent/tunnel
      register: _cc_outbound_private

    - name: Refuse missing or other-UID Node state rather than sharing credentials
      ansible.builtin.assert:
        that:
          - item.stat.isdir | default(false)
          - not (item.stat.islnk | default(true))
          - item.stat.uid == cc_agent_outbound_control_service_uid
          - item.stat.gid == cc_agent_outbound_control_service_gid
          - item.stat.mode == '0700'
      loop: '{{ _cc_outbound_private.results }}'

    - name: Observe fixed private control parent without repairing it
      ansible.builtin.stat:
        path: /var/lib/consolecrypt-agent/tunnel/control
        follow: false
        get_checksum: false
      register: _cc_outbound_control

    - name: Refuse foreign or partially owned control directory
      ansible.builtin.assert:
        that:
          - not _cc_outbound_control.stat.exists or (_cc_outbound_control.stat.isdir | default(false) and not (_cc_outbound_control.stat.islnk | default(true)) and _cc_outbound_control.stat.uid == cc_agent_outbound_control_service_uid and _cc_outbound_control.stat.gid == cc_agent_outbound_control_service_gid and _cc_outbound_control.stat.mode == '0700')

    - name: Create only absent private control directory, never keys or bootstrap data
      ansible.builtin.file:
        path: /var/lib/consolecrypt-agent/tunnel/control
        state: directory
        owner: consolecrypt-agent
        group: consolecrypt-agent
        mode: '0700'
      when: not _cc_outbound_control.stat.exists

    - name: Exclusively publish only the fixed unit and original inode-bound receipt
      ansible.builtin.command:
        argv:
          - /usr/bin/python3.12
          - -I
          - -B
          - -c
          - '{{ lookup("ansible.builtin.file", role_path + "/files/outbound_control_publish.py", rstrip=False) }}'
          - '{{ cc_agent_outbound_control_service_uid | string }}'
          - '{{ cc_agent_outbound_control_service_gid | string }}'
          - '{{ cc_agent_outbound_control_relay_ip }}'
      register: _cc_outbound_publication
      changed_when: (_cc_outbound_publication.stdout | from_json).publication == 'created'
      timeout: 10

    - name: Require closed actual publisher readback before any reload or activation
      ansible.builtin.assert:
        that:
          - (_cc_outbound_publication.stdout | from_json).keys() | list | sort == ['format', 'publication', 'uid', 'gid', 'unitSha256'] | sort
          - (_cc_outbound_publication.stdout | from_json).format == 'cc-agent-outbound-control-publication-result/v1'
          - (_cc_outbound_publication.stdout | from_json).publication in ['created', 'alreadyOwned']
          - (_cc_outbound_publication.stdout | from_json).uid == cc_agent_outbound_control_service_uid
          - (_cc_outbound_publication.stdout | from_json).gid == cc_agent_outbound_control_service_gid
          - (_cc_outbound_publication.stdout | from_json).unitSha256 is match('^[0-9a-f]{64}$')

    - name: Reload only after explicit reviewed fixed-unit publication
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Observe effective source closure, not merely same-looking properties
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, --no-pager, show, consolecrypt-agent-outbound-control.service, --property=FragmentPath, --property=DropInPaths]
      register: _cc_outbound_effective
      changed_when: false

    - name: Reject any foreign systemd override
      ansible.builtin.assert:
        that:
          - _cc_outbound_effective.stdout_lines | sort == ['DropInPaths=', 'FragmentPath=/etc/systemd/system/consolecrypt-agent-outbound-control.service'] | sort

    - name: Observe credential custody only before explicit start, never read its token
      ansible.builtin.stat:
        path: /var/lib/consolecrypt-agent/tunnel/control/bootstrap.json
        follow: false
        get_checksum: false
      register: _cc_outbound_bootstrap
      when: cc_agent_outbound_control_start

    - name: Require the already bootstrapped same-UID private credential before activation
      ansible.builtin.assert:
        that:
          - _cc_outbound_bootstrap.stat.isreg | default(false)
          - not (_cc_outbound_bootstrap.stat.islnk | default(true))
          - _cc_outbound_bootstrap.stat.uid == cc_agent_outbound_control_service_uid
          - _cc_outbound_bootstrap.stat.nlink == 1 and _cc_outbound_bootstrap.stat.mode == '0600'
          - _cc_outbound_bootstrap.stat.size > 0 and _cc_outbound_bootstrap.stat.size <= 16384
      when: cc_agent_outbound_control_start

    - name: Activate only the explicitly approved fixed finite service
      ansible.builtin.systemd_service:
        name: consolecrypt-agent-outbound-control.service
        enabled: true
        state: started
      register: _cc_outbound_started
      when: cc_agent_outbound_control_start

    - name: Require actual active readback after requested start
      ansible.builtin.assert:
        that:
          - _cc_outbound_started.status.ActiveState == 'active'
      when: cc_agent_outbound_control_start
