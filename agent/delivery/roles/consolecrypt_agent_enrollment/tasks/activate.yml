---
- name: Stage inactive root-owned authorized public key bytes
  ansible.builtin.template:
    src: enrollment-authorized-keys.j2
    dest: /etc/consolecrypt-agent/enrollment-authorized-keys.candidate
    owner: root
    group: root
    mode: '0644'
- name: Check existing journal integrity without enrollment authority claims
  ansible.builtin.command:
    argv: [/usr/bin/python3, -I, -B, /usr/libexec/consolecrypt-agent/enrollment-admin, --status]
  changed_when: false
  no_log: true
  when: not ansible_check_mode
- name: Check PAM/account and full SSH/sudo candidates before any key or grant publication
  ansible.builtin.command:
    argv: [/usr/bin/python3, -I, -B, /usr/libexec/consolecrypt-agent/enrollment-role-check, --activation-check]
  changed_when: false
- name: Publish validated role and verify actual installed full config before optional reload
  block:
    - name: Publish only the exact zeroarg sudo candidate before SSH keys or ingress
      ansible.builtin.copy:
        src: /etc/consolecrypt-agent/enrollment-sudoers-candidate
        dest: /etc/sudoers.d/consolecrypt-agent-enrollment
        remote_src: true
        force: false
        owner: root
        group: root
        mode: '0440'
    - name: Require the actual exclusive effective sudo command before SSH keys or ingress
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, -B, /usr/libexec/consolecrypt-agent/enrollment-role-check, --sudo-check]
      changed_when: false
    - name: Publish root public keys and fixed SSH fragment only after effective sudo validation
      ansible.builtin.copy:
        src: '{{ item.src }}'
        dest: '{{ item.dest }}'
        remote_src: true
        force: false
        owner: root
        group: root
        mode: '{{ item.mode }}'
      loop:
        - {src: /etc/consolecrypt-agent/enrollment-authorized-keys.candidate, dest: /etc/consolecrypt-agent/enrollment-authorized-keys, mode: '0644'}
        - {src: /etc/consolecrypt-agent/enrollment-sshd-candidate.conf, dest: /etc/ssh/sshd_config.d/00-consolecrypt-agent-enrollment.conf, mode: '0644'}
    - name: Validate actual full config and sudo policy after exact publication
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, -B, /usr/libexec/consolecrypt-agent/enrollment-role-check, --live-check]
      changed_when: false
    - name: Request only the explicitly enabled SSH reload
      ansible.builtin.debug:
        msg: Fixed enrollment role validated; actual pinned Native SSH authentication remains a separate acceptance gate.
      changed_when: true
      notify: Reload explicitly enabled enrollment SSH role
  rescue:
    - name: Refuse activation and retain ambiguous partial publication for manual reconciliation
      ansible.builtin.fail:
        msg: Enrollment validation failed; fixed paths may be partially published and are retained for manual reconciliation. This role requested no SSH reload and claims no rollback.
