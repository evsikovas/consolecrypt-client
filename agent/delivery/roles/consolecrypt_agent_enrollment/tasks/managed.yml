---
- name: Require the supported installed host and explicit independent public identities
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu' and ansible_distribution_version == '24.04'
      - ansible_architecture in ['x86_64', 'aarch64']
      - ansible_user_uid | int == 0
      - not ansible_check_mode
      - cc_agent_enrollment_operator_uid is integer and cc_agent_enrollment_operator_uid >= 1000
      - cc_agent_enrollment_operator_gid is integer and cc_agent_enrollment_operator_gid >= 1000
      - cc_agent_enrollment_service_uid is integer and cc_agent_enrollment_service_uid > 0
      - cc_agent_enrollment_service_gid is integer and cc_agent_enrollment_service_gid > 0
      - cc_agent_enrollment_operator_uid != cc_agent_enrollment_service_uid
      - cc_agent_enrollment_operator_gid != cc_agent_enrollment_service_gid
      - cc_agent_enrollment_agent_id is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
      - cc_agent_enrollment_agent_id != '00000000-0000-0000-0000-000000000000'
      - cc_agent_identity_fleet_ids is mapping
      - cc_agent_identity_fleet_ids | length == 0 or cc_agent_identity_fleet_ids[inventory_hostname] == cc_agent_enrollment_agent_id
      - ansible_play_hosts_all | length == 1 or ansible_play_hosts_all | difference(cc_agent_identity_fleet_ids.keys() | list) | length == 0
      - cc_agent_identity_fleet_ids.values() | list | unique | length == cc_agent_identity_fleet_ids | length
      - cc_agent_enrollment_public_keys is sequence and cc_agent_enrollment_public_keys is not string
      - cc_agent_enrollment_genesis is mapping
    fail_msg: Explicit unique host IDs, account IDs, public keys and independently reviewed genesis are required; check mode is not activation validation.

- name: Inspect fixed root-controlled installation ancestors without following links
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
    get_checksum: false
  loop:
    - /etc
    - /etc/consolecrypt-agent
    - /etc/ssh
    - /etc/ssh/sshd_config.d
    - /etc/sudoers.d
    - /usr
    - /usr/libexec
    - /usr/libexec/consolecrypt-agent
    - /var
    - /var/lib
    - /var/lib/consolecrypt-agent
    - /var/empty
    - /var/empty/cc-agent-enroll
  register: _cc_enroll_ancestors
- name: Reject existing linked, writable or nonroot installation parents
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isdir | default(false) and not item.stat.islnk | default(true) and item.stat.uid == 0 and (item.stat.mode | int(base=8)) % 32 < 16 and (item.stat.mode | int(base=8)) % 4 < 2)
    fail_msg: Fixed system installation parents must be physical root-owned and not group/world writable; no ownership repair.
  loop: '{{ _cc_enroll_ancestors.results }}'
  loop_control:
    label: '{{ item.item }}'
- name: Create missing fixed root installation directories only
  ansible.builtin.file:
    path: '{{ item.item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: '{{ _cc_enroll_ancestors.results }}'
  when: not item.stat.exists
  loop_control:
    label: '{{ item.item }}'

- name: Install fixed root-only role validator
  ansible.builtin.copy:
    src: enrollment-role-check
    dest: /usr/libexec/consolecrypt-agent/enrollment-role-check
    owner: root
    group: root
    mode: '0700'
- name: Stage bounded public root policy, never a remote authority input
  ansible.builtin.copy:
    content: '{{ _cc_enroll_role_policy | to_json }}'
    dest: /etc/consolecrypt-agent/enrollment-role-policy.json
    owner: root
    group: root
    mode: '0600'
  vars:
    _cc_enroll_role_policy:
      operatorUid: '{{ cc_agent_enrollment_operator_uid }}'
      operatorGid: '{{ cc_agent_enrollment_operator_gid }}'
      serviceUid: '{{ cc_agent_enrollment_service_uid }}'
      serviceGid: '{{ cc_agent_enrollment_service_gid }}'
      createService: '{{ cc_agent_enrollment_create_service }}'
      agentId: '{{ cc_agent_enrollment_agent_id }}'
      authorizedKeys: '{{ cc_agent_enrollment_public_keys }}'
      pamContextReviewed: '{{ cc_agent_enrollment_pam_context_reviewed }}'
      sudoNologinReviewed: '{{ cc_agent_enrollment_sudo_nologin_reviewed }}'
      daemonDefaultConfigReviewed: '{{ cc_agent_enrollment_default_sshd_config_reviewed }}'
      exclusiveBootstrapApproved: '{{ cc_agent_enrollment_exclusive_bootstrap_approved }}'
- name: Reject account collisions and unapproved changes before account creation
  ansible.builtin.command:
    argv: [/usr/bin/python3, -I, -B, /usr/libexec/consolecrypt-agent/enrollment-role-check, --account-plan]
  changed_when: false
- name: Read existing account database without creating identities
  ansible.builtin.getent:
    database: passwd
- name: Read existing group database without creating groups
  ansible.builtin.getent:
    database: group
- name: Create missing explicit private groups only
  ansible.builtin.group:
    name: '{{ item.name }}'
    gid: '{{ item.gid }}'
    state: present
  loop:
    - {name: consolecrypt-agent, gid: '{{ cc_agent_enrollment_service_gid }}'}
    - {name: cc-agent-enroll, gid: '{{ cc_agent_enrollment_operator_gid }}'}
  when: item.name not in ansible_facts.getent_group
- name: Create the missing explicitly approved service account without SSH or a home
  ansible.builtin.user:
    name: consolecrypt-agent
    uid: '{{ cc_agent_enrollment_service_uid }}'
    group: consolecrypt-agent
    groups: ''
    append: false
    create_home: false
    home: /var/lib/consolecrypt-agent
    shell: /usr/sbin/nologin
    password_lock: true
  when: "'consolecrypt-agent' not in ansible_facts.getent_passwd and cc_agent_enrollment_create_service"
- name: Create missing restricted operator without unlocking any existing account
  ansible.builtin.user:
    name: cc-agent-enroll
    uid: '{{ cc_agent_enrollment_operator_uid }}'
    group: cc-agent-enroll
    groups: ''
    append: false
    create_home: false
    home: /var/empty/cc-agent-enroll
    shell: /usr/libexec/consolecrypt-agent/enrollment-login-shell
    password_lock: true
  when: "'cc-agent-enroll' not in ansible_facts.getent_passwd"
- name: Install fixed wrappers and local-only admin helper
  ansible.builtin.copy:
    src: '{{ item.name }}'
    dest: '/usr/libexec/consolecrypt-agent/{{ item.name }}'
    owner: root
    group: root
    mode: '{{ item.mode }}'
  loop:
    - {name: enrollment-login-shell, mode: '0755'}
    - {name: enrollment-worker, mode: '0755'}
    - {name: enrollment-admin, mode: '0700'}

- name: Stage explicit public genesis bytes
  ansible.builtin.copy:
    content: '{{ cc_agent_enrollment_genesis | to_json }}'
    dest: /etc/consolecrypt-agent/enrollment-genesis-owner.candidate.json
    owner: root
    group: root
    mode: '0644'
- name: Stage fixed public enrollment configuration
  ansible.builtin.copy:
    content: '{{ _cc_enroll_config | to_json }}'
    dest: /etc/consolecrypt-agent/enrollment-control.candidate.json
    owner: root
    group: root
    mode: '0644'
  vars:
    _cc_enroll_config:
      format: cc-agent-enroll-config/v1
      agentId: '{{ cc_agent_enrollment_agent_id }}'
      nodeDir: /var/lib/consolecrypt-agent/identity/node
      dbDir: /var/lib/consolecrypt-agent/identity/sqlite
      anchorDir: /var/lib/consolecrypt-agent/checkpoints/enrollment
      ownerPin: /etc/consolecrypt-agent/enrollment-genesis-owner.json
- name: Validate fixed inputs and reject existing config or trust changes
  ansible.builtin.command:
    argv: [/usr/bin/python3, -I, -B, /usr/libexec/consolecrypt-agent/enrollment-role-check, --inputs]
  changed_when: false
- name: Publish config and public genesis once without overwrite
  ansible.builtin.copy:
    src: '/etc/consolecrypt-agent/{{ item }}.candidate.json'
    dest: '/etc/consolecrypt-agent/{{ item }}.json'
    remote_src: true
    force: false
    owner: root
    group: root
    mode: '0644'
  loop: [enrollment-control, enrollment-genesis-owner]
- name: Inspect private state parents without modifying existing ownership
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
    get_checksum: false
  loop: [/var/lib/consolecrypt-agent/identity, /var/lib/consolecrypt-agent/checkpoints]
  register: _cc_enroll_state_parents
- name: Require exact service-owned private state parents when present
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isdir | default(false) and not item.stat.islnk | default(true) and item.stat.uid == cc_agent_enrollment_service_uid and item.stat.gid == cc_agent_enrollment_service_gid and item.stat.mode == '0700')
  loop: '{{ _cc_enroll_state_parents.results }}'
- name: Create missing private parents, never Node or journal implicitly
  ansible.builtin.file:
    path: '{{ item.item }}'
    state: directory
    owner: consolecrypt-agent
    group: consolecrypt-agent
    mode: '0700'
  loop: '{{ _cc_enroll_state_parents.results }}'
  when: not item.stat.exists
- name: Explicitly provision or validate only the host-local Node
  ansible.builtin.command:
    argv: [/usr/bin/python3, -I, -B, /usr/libexec/consolecrypt-agent/enrollment-admin, --node-provision]
  when: cc_agent_enrollment_node_provision and not ansible_check_mode
  changed_when: true
  no_log: true
- name: Exclusively initialize only wholly absent journal and anchor
  ansible.builtin.command:
    argv: [/usr/bin/python3, -I, -B, /usr/libexec/consolecrypt-agent/enrollment-admin, --store-init]
  when: cc_agent_enrollment_store_init and not ansible_check_mode
  changed_when: true
  no_log: true
- name: Install inactive exact SSH and sudo candidates
  ansible.builtin.template:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
    owner: root
    group: root
    mode: '0600'
  loop:
    - {src: enrollment-sshd.conf.j2, dest: /etc/consolecrypt-agent/enrollment-sshd-candidate.conf}
    - {src: enrollment-sudoers.j2, dest: /etc/consolecrypt-agent/enrollment-sudoers-candidate}
- name: Explicit SSH activation with full candidate validation
  ansible.builtin.include_tasks: activate.yml
  when: cc_agent_enrollment_activate and not ansible_check_mode
