---
- name: Install fixed reviewed configuration backup helper
  ansible.builtin.copy:
    src: monitoring_backup.py
    dest: /opt/consolecrypt-monitoring/monitoring_backup.py
    owner: root
    group: root
    mode: '0644'
    follow: false

- name: Capture only the current explicit reviewed restore intent
  ansible.builtin.set_fact:
    cc_monitoring_backup_intent:
      version: 1
      config: '{{ cc_prometheus_config }}'
      rulesSha256: '{{ lookup("ansible.builtin.file", "rules.yml", lstrip=false, rstrip=false) | hash("sha256") }}'
      unitSha256: '{{ lookup("ansible.builtin.template", "prometheus.service.j2") | hash("sha256") }}'
  no_log: true

- name: Observe the original metric data directory without creating or reading data
  ansible.builtin.stat:
    path: /srv/consolecrypt-monitoring/data
    follow: false
    get_checksum: false
  register: cc_monitoring_original_data

- name: Refuse implicit metric data initialization during configuration recovery
  ansible.builtin.assert:
    that:
      - cc_monitoring_original_data.stat.isdir | default(false)
      - not (cc_monitoring_original_data.stat.islnk | default(true))
      - cc_monitoring_original_data.stat.pw_name | default('') == 'cc-monitoring'
      - cc_monitoring_original_data.stat.mode == '0700'

- name: Validate all backup bytes and restore only the fixed configuration mapping
  ansible.builtin.command:
    argv:
      - '{{ cc_node_facts.ansible_facts.ansible_python.executable }}'
      - /opt/consolecrypt-monitoring/monitoring_backup.py
      - --restore-reviewed-backup
    stdin: '{{ cc_monitoring_backup_intent | to_json }}'
  changed_when: true
  failed_when: false
  register: cc_monitoring_restore_result
  no_log: true

- name: Report only the closed configuration restore error category
  ansible.builtin.assert:
    that: cc_monitoring_restore_result.rc == 0
    fail_msg: 'Monitoring configuration restore refused (code {{ cc_monitoring_restore_result.rc | int }}); configuration and tool output remain private.'

- name: Restart the installed service only after all restore preflights succeeded
  ansible.builtin.systemd_service:
    name: consolecrypt-prometheus
    daemon_reload: true
    state: restarted

- name: Observe actual restored loopback readiness
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/-/ready
    method: GET
    status_code: 200
    use_proxy: false
    return_content: false
    timeout: 3
  register: cc_monitoring_restored_ready
  until: cc_monitoring_restored_ready.status | default(0) == 200
  retries: 15
  delay: 2
