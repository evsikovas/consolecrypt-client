[package]
name = "cc-sftp-core"
description = "SFTP (russh-sftp)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# `cc_sftp_core::test_server`: in-process SFTP server over a local directory
# for consumers' tests (app-core, bridge). Never enable in production builds.
test-harness = []

[dependencies]
cc-ssh-core.workspace = true
cc-platform-core.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
async-trait.workspace = true
uuid.workspace = true
hex.workspace = true
# SFTP protocol client (Apache-2.0).
russh-sftp = "3"
# Edit sessions: content hashes (MIT OR Apache-2.0).
sha2 = "0.11"
# Edit sessions: debounced directory watching (MIT OR Apache-2.0); re-exports
# `notify` 8 (CC0-1.0) — FSEvents on macOS, inotify on Linux,
# ReadDirectoryChangesW on Windows.
notify-debouncer-full = "0.7"

[dev-dependencies]
cc-ssh-core = { workspace = true, features = ["test-harness"] }
cc-models.workspace = true
tempfile.workspace = true

[lints]
workspace = true
