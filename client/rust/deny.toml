# cargo-deny policy (ADR-0005). Run: cargo deny check  (in client/rust)
[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]

# ConsoleCrypt code is AGPL; third-party policy remains unchanged.
exceptions = [
    { name = "cc-ai-core", allow = ["AGPL-3.0-only"] },
    { name = "cc-app-core", allow = ["AGPL-3.0-only"] },
    { name = "cc-bridge", allow = ["AGPL-3.0-only"] },
    { name = "cc-cli", allow = ["AGPL-3.0-only"] },
    { name = "cc-crypto-core", allow = ["AGPL-3.0-only"] },
    { name = "cc-platform-core", allow = ["AGPL-3.0-only"] },
    { name = "cc-search-core", allow = ["AGPL-3.0-only"] },
    { name = "cc-sftp-core", allow = ["AGPL-3.0-only"] },
    { name = "cc-ssh-agent-core", allow = ["AGPL-3.0-only"] },
    { name = "cc-ssh-core", allow = ["AGPL-3.0-only"] },
    { name = "cc-storage-core", allow = ["AGPL-3.0-only"] },
    { name = "cc-sync-core", allow = ["AGPL-3.0-only"] },
    { name = "cc-terminal-core", allow = ["AGPL-3.0-only"] },
    { name = "cc-tunnel-core", allow = ["AGPL-3.0-only"] },
    { name = "cc-vault-core", allow = ["AGPL-3.0-only"] },
    { name = "cc-models", allow = ["AGPL-3.0-only"] },
    { name = "cc-protocol", allow = ["AGPL-3.0-only"] },
]

# allo-isolate (flutter_rust_bridge's Dart isolate glue) ships only a
# LICENSE file with the Apache-2.0 text and no `license` field.
[[licenses.clarify]]
crate = "allo-isolate"
expression = "Apache-2.0"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
