[package]
name = "cc-wslc-core"
description = "WSL Containers runtime, plans and resource operations"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
bridge = []

[dependencies]
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "macros"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true
tempfile.workspace = true
portable-pty = "0.9"
# Maintained drop-in from the YAML organization; no deprecated serde_yaml.
serde_yaml = { package = "yaml_serde", version = "0.10.7" }

[target.'cfg(windows)'.dependencies]
winreg = "0.10"
rfd = { version = "0.17.2", default-features = false }

[lints]
workspace = true
