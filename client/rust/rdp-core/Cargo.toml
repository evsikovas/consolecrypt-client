[package]
name = "cc-rdp-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
ironrdp = { version = "=0.17.0", features = ["connector", "session", "graphics", "input", "dvc", "displaycontrol", "cliprdr", "rdpdr", "rdpsnd", "svc"] }
ironrdp-tokio = "=0.10.0"
# SSPI 0.23.0 predates the extra exhaustive-match enum variant in picky-krb 0.12.5.
picky-krb = "=0.12.4"
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
x509-cert = { version = "0.2", features = ["std"] }
sha2 = "0.10"
tokio.workspace = true
secrecy.workspace = true
zeroize.workspace = true
uuid.workspace = true
thiserror.workspace = true
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
rfd = { version = "=0.15.4", default-features = false, features = ["xdg-portal", "tokio"] }

[dev-dependencies]
ironrdp-bulk = "=0.1.1"
rcgen = "0.14"
serde.workspace = true
serde_json.workspace = true
tempfile = "=3.27.0"

[lints]
workspace = true
