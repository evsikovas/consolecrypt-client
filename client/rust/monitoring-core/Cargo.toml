[package]
name = "cc-monitoring-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-only"
publish = false

# Integrated after the immutable R6 preview.

[dependencies]
cc-host-mapping = { path = "../host-mapping" }
base64 = "=0.22.1"
chrono = { workspace = true }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "form", "query"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
url = "=2.5.8"
zeroize = "=1.9.1"

# Already pinned in the workspace lock; SSH carries bytes, HTTP/TLS stay here.
bytes = "=1.12.1"
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
webpki-roots = "=1.0.10"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
rcgen = "=0.14.10"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
