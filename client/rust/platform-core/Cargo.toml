[package]
name = "cc-platform-core"
description = "OS integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["os-keychain"]
# OS secure store: native keychains plus Linux Secret Service. Linux never
# falls back to files, the transient session collection, or a plaintext bus.
os-keychain = [
    "dep:keyring-core",
    "dep:apple-native-keyring-store",
    "dep:windows-native-keyring-store",
    "dep:android-native-keyring-store",
    "dep:secret-service",
    "dep:base64",
    "dep:core-foundation",
    "dep:objc2",
    "dep:windows",
    "dep:ctap-hid-fido2",
    "dep:anyhow",
]

[dependencies]
thiserror.workspace = true
secrecy.workspace = true
zeroize.workspace = true
directories = "6"
# Open files with the OS default application (Windows ShellExecuteW, xdg-open
# fallbacks). MIT OR Apache-2.0. No features: `reveal` would pull zbus.
opener = "0.8"
keyring-core = { version = "1", optional = true }
# Random device unlock keys (Linux keyring, tests); same version as crypto-core.
getrandom = "0.4"
# Security key PRF salt (FEAT-16); already in the lockfile.
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", optional = true, features = ["keychain"] }
# setxattr: `com.apple.quarantine` on downloaded files (mark.rs). Already in
# the lockfile.
libc = "0.2"
# Security keys (FEAT-16) over CTAP2/HID: the app asks for the PIN. MIT.
ctap-hid-fido2 = { version = "3.6", optional = true }
anyhow = { version = "1", optional = true }

# Device unlock (S5): Secure Enclave key + LAContext (Security and
# LocalAuthentication frameworks). Already in the lockfile; no new crates.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
core-foundation = { version = "0.10", optional = true }
objc2 = { version = "0.6", optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
# iOS has the application-scoped protected-data keychain; the macOS legacy
# keychain implementation cannot be used here.
apple-native-keyring-store = { version = "1", optional = true, features = ["protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1", optional = true, default-features = false }
# Device unlock (S5): Windows Hello KeyCredentialManager. Same version as the
# one already in the lockfile; only WinRT features are added.
windows = { version = "0.62", optional = true, features = [
    "Foundation",
    "Security_Credentials",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Networking_WindowsWebServices",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = { version = "1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Blocking API owns its async-io executor, including when AppCore calls it from
# a Tokio blocking worker. DH encrypts the session bus; no libsecret C ABI.
secret-service = { version = "5.2", optional = true, default-features = false, features = ["rt-async-io-crypto-rust"] }
# KWallet's Secret Service accepts UTF-8 values, including binary device keys
# encoded inside the encrypted item. Buffers are zeroized after use.
base64 = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
