[package]
name = "cc-platform-core"
description = "OS integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["os-keychain"]
# OS secure store: native keychains plus Linux Secret Service. Linux never
# falls back to files, the transient session collection, or a plaintext bus.
os-keychain = [
    "dep:keyring-core",
    "dep:apple-native-keyring-store",
    "dep:windows-native-keyring-store",
    "dep:android-native-keyring-store",
    "dep:secret-service",
    "dep:base64",
]

[dependencies]
thiserror.workspace = true
secrecy.workspace = true
zeroize.workspace = true
directories = "6"
# Open files with the OS default application (Windows ShellExecuteW, xdg-open
# fallbacks). MIT OR Apache-2.0. No features: `reveal` would pull zbus.
opener = "0.8"
keyring-core = { version = "1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", optional = true, features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
# iOS has the application-scoped protected-data keychain; the macOS legacy
# keychain implementation cannot be used here.
apple-native-keyring-store = { version = "1", optional = true, features = ["protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1", optional = true, default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = { version = "1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Blocking API owns its async-io executor, including when AppCore calls it from
# a Tokio blocking worker. DH encrypts the session bus; no libsecret C ABI.
secret-service = { version = "5.2", optional = true, default-features = false, features = ["rt-async-io-crypto-rust"] }
# KWallet's Secret Service accepts UTF-8 values, including binary device keys
# encoded inside the encrypted item. Buffers are zeroized after use.
base64 = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
