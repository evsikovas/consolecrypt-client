[package]
name = "cc-k8s-core"
description = "Kubernetes transport policy and session management"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
cc-models.workspace = true
cc-ai-core.workspace = true
dunce.workspace = true
x509-parser = "0.18"
rcgen = "0.14"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
bytes.workspace = true
subtle = "2"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
futures.workspace = true
flate2 = "1"
sha2 = "0.11"
ring = "0.17"
reqwest = { workspace = true, features = ["stream"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
thiserror.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-util = "0.7"
kube = { version = "=4.2.0", default-features = false, features = ["client", "runtime", "rustls-tls", "ring", "webpki-roots", "ws", "http-proxy", "socks5"] }
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_32"] }
base64.workspace = true
secrecy.workspace = true
url.workspace = true
zeroize.workspace = true
serde-saphyr = "=0.0.29"
pem = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }

[dev-dependencies]
tempfile.workspace = true
http-body-util = "0.1"
bytes.workspace = true
futures.workspace = true
rcgen = "0.14"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.29"

[lints]
workspace = true
