[package]
name = "cc-k8s-core"
description = "Kubernetes transport policy and session management"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
cc-models.workspace = true
serde_json.workspace = true
http = "1"
tower = { version = "0.5", features = ["util"] }
thiserror.workspace = true
uuid.workspace = true
tokio.workspace = true
tokio-util = "0.7"
kube = { version = "=4.2.0", default-features = false, features = ["client", "runtime", "rustls-tls", "ring", "webpki-roots", "ws", "http-proxy", "socks5"] }
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_32"] }
base64.workspace = true
secrecy.workspace = true
url.workspace = true
zeroize.workspace = true
serde-saphyr = "=0.0.29"
pem = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
rcgen = "0.14"
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true
