[package]
name = "cc-sync-core"
description = "Sync client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# In-process axum mock of the ConsoleCrypt sync server (in-memory state).
# For tests of this and other crates and for `cc` CLI E2E tests. Never enable
# in production builds.
mock-server = ["dep:axum", "dep:sha2", "dep:ed25519-dalek"]

[dependencies]
cc-protocol.workspace = true
cc-models.workspace = true
cc-storage-core.workspace = true
tokio = { workspace = true }
futures.workspace = true
bytes.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
url.workspace = true
reqwest.workspace = true
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-platform-verifier = "0.7"
# SECURITY: tungstenite logs the full WebSocket handshake request — including
# `Authorization: Bearer …` — via `log::trace!` (handshake/client.rs). Cargo
# unifies features, so capping `log` here compiles TRACE records out of every
# binary that links sync-core, regardless of the subscriber configuration.
# Runtime directives in `SAFE_LOG_DIRECTIVES` are the second layer.
log = { version = "0.4", features = ["max_level_debug", "release_max_level_info"] }

# mock-server only
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
sha2 = { version = "0.11", optional = true }
ed25519-dalek = { version = "3", optional = true }

[dev-dependencies]
tracing-log = "0.2"
# Enables the mock server for this crate's own integration tests.
cc-sync-core = { path = ".", features = ["mock-server"] }
tempfile.workspace = true
uuid.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true }
ed25519-dalek = "3"
sha2 = "0.11"

[lints]
workspace = true
