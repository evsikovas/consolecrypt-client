[package]
name = "fido-probe"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Alexander Evsikov <i@evsikov.net>"]
publish = false
description = "FEAT-16 prototype: does Windows webauthn.dll give a stable hmac-secret (PRF) from a security key?"

# Standalone: not part of the client workspace.
[workspace]

[dependencies]
base64 = "0.22"
getrandom = "0.3"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WindowsWebServices",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }
