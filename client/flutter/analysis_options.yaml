# Strict static analysis for the ConsoleCrypt Flutter client.
# `flutter analyze` must report zero issues (CI gate, CLIENT_SPEC §19).
include: package:flutter_lints/flutter.yaml

# `dart format` settings (CI: dart format --output=none --set-exit-if-changed lib test).
formatter:
  page_width: 120

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Treat these as hard errors, not hints.
    missing_required_param: error
    missing_return: error
    unawaited_futures: error
    avoid_print: error
  exclude:
    - build/**
    - macos/**
    - windows/**
    # flutter_rust_bridge output (ADR-0101 §8); generated, not hand-edited.
    - lib/src/rust/**
    # Vendored cargokit build tool (own package, resolved at build time).
    - rust_builder/**
    - android/**

linter:
  rules:
    - always_declare_return_types
    - always_use_package_imports
    - avoid_catching_errors
    - avoid_dynamic_calls
    - avoid_print
    - avoid_returning_null_for_void
    - avoid_slow_async_io
    - avoid_type_to_string
    - avoid_unused_constructor_parameters
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - no_runtimeType_toString
    - only_throw_errors
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - prefer_void_to_null
    - sort_child_properties_last
    - test_types_in_equals
    - throw_in_finally
    - type_annotate_public_apis
    - unawaited_futures
    - unnecessary_statements
    - use_colored_box
    - use_decorated_box
    - use_named_constants
    - use_super_parameters
