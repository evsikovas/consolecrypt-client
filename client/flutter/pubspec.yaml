name: consolecrypt
description: "ConsoleCrypt desktop client UI: zero-knowledge E2EE SSH client (Flutter shell over the Rust app-core)."
# Never published to pub.dev; distributed as a desktop application.
publish_to: 'none'

version: 0.1.20+47

environment:
  sdk: ^3.13.4
  flutter: '>=3.47.0'

# Every dependency is justified and license-checked in
# docs/adr/ADR-0101-ui-architecture-and-bridge.md (ADR-0005 allow-list).
dependencies:
  flutter:
    sdk: flutter
  # State management and DI (MIT).
  flutter_riverpod: ^3.4.3
  # Declarative routing with redirects and stateful shell (BSD-3-Clause).
  go_router: ^18.0.1
  # Terminal emulator widget (MIT). Wrapped by lib/terminal/terminal_pane.dart.
  xterm: ^4.0.0
  # Recovery Kit QR code (BSD-3-Clause).
  qr_flutter: ^4.1.0
  material_ui: ^1.4.0
  # Localizations for the framework widgets; required by gen-l10n output (BSD-3-Clause, SDK).
  flutter_localizations:
    sdk: flutter
  # ICU messages, plurals, locale-aware date/number formatting (BSD-3-Clause).
  # Pinned to the range flutter_localizations requires.
  intl: ^0.20.3
  # macOS window chrome for the Liquid Glass shell: transparent unified title
  # bar, full-size content view, toolbar passthrough (MIT, no dependencies).
  macos_window_utils: ^1.9.1
  # Dart side of the Rust core bindings (MIT). EXACT pin: must equal the Rust
  # crate `flutter_rust_bridge` in client/rust/bridge/Cargo.toml and the
  # `flutter_rust_bridge_codegen` used to generate lib/src/rust (ADR-0101 §8).
  flutter_rust_bridge: 2.13.0
  # Build-only FFI plugin: cargokit builds and bundles client/rust/bridge.
  cc_bridge:
    path: rust_builder
  # Native open/save/folder dialogs for backups (flutter.dev, BSD-3-Clause).
  file_selector: ^1.1.0
  # Declarative iTerm colour preset import (MIT); never executes XML content.
  xml: ^7.0.1
  # Drop files from Finder/Explorer into the SFTP browser = upload (Apache-2.0;
  # MixinNetwork). Drop-in only; drag-out is deferred (lib/sftp/widgets/sftp_drop_target.dart).
  desktop_drop: ^0.8.4
  # Authenticate update feeds (Apache-2.0) and installer digests (BSD-3-Clause).
  cryptography: ^2.9.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the real Rust core in the macOS/Windows app (integration_test/).
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Fake native file picker in import/export widget tests (BSD-3-Clause).
  file_selector_platform_interface: ^2.7.0

flutter:
  uses-material-design: true
  # gen-l10n: lib/l10n/app_*.arb -> lib/l10n/app_localizations*.dart (see l10n.yaml).
  generate: true
  # Liquid Glass edge refraction (macOS + Impeller only; LIQUID_GLASS_SPEC §6.5).
  shaders:
    - shaders/liquid_glass.frag
  # Brand: wordmark, "C▷" mark, shield logo (docs/brand, generated by
  # docs/brand/generate_icons.swift). Used only through lib/app/brand.dart.
  assets:
    - assets/brand/
