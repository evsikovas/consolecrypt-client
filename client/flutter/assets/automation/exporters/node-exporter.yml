---
- name: Inspect or explicitly install a new loopback node exporter
  hosts: all
  gather_facts: false
  become: false
  vars:
    cc_exporter_mode: inspect
  tasks:
    - name: Validate explicit operation and platform
      ansible.builtin.assert:
        that:
          - cc_exporter_mode in ['inspect', 'install']
        fail_msg: Choose inspect or explicitly review install before running.

    - name: Read the actual kernel family
      ansible.builtin.command:
        argv: [uname, -s]
      register: cc_kernel
      check_mode: false
      changed_when: false

    - name: Read the actual binary architecture
      ansible.builtin.command:
        argv: [uname, -m]
      register: cc_architecture
      check_mode: false
      changed_when: false

    - name: Require supported Linux before interpreting installation metadata
      ansible.builtin.assert:
        that:
          - cc_kernel.stdout == 'Linux'
          - cc_architecture.stdout in ['x86_64', 'aarch64']
        fail_msg: This template supports Linux amd64 and arm64 only.

    - name: Read service metadata without exposing service arguments
      ansible.builtin.service_facts:
      no_log: true

    - name: Read installed package metadata
      ansible.builtin.package_facts:
        manager: auto
      no_log: true

    - name: Detect known node exporter binaries and reserved install paths
      ansible.builtin.stat:
        path: '{{ item }}'
        follow: false
      loop:
        - /usr/bin/node_exporter
        - /usr/bin/prometheus-node-exporter
        - /usr/local/bin/node_exporter
        - /usr/local/libexec/consolecrypt-node-exporter
        - /opt/consolecrypt-node-exporter
        - /etc/systemd/system/consolecrypt-node-exporter.service
        - /etc/systemd/system/consolecrypt-node-exporter.service.d
        - /run/systemd/system/consolecrypt-node-exporter.service
        - /run/systemd/system/consolecrypt-node-exporter.service.d
        - /usr/lib/systemd/system/consolecrypt-node-exporter.service
        - /usr/lib/systemd/system/consolecrypt-node-exporter.service.d
      register: cc_existing_paths

    - name: Detect a running exporter without changing it
      ansible.builtin.command:
        argv: [pgrep, -x, node_exporter]
      register: cc_existing_process
      check_mode: false
      changed_when: false
      failed_when: cc_existing_process.rc not in [0, 1]
      no_log: true

    - name: Report bounded existing installation summary
      ansible.builtin.debug:
        msg:
          existing_binary_or_path: '{{ cc_existing_paths.results | selectattr("stat.exists") | list | length > 0 }}'
          running_process: '{{ cc_existing_process.rc == 0 }}'
          known_service: >-
            {{ 'node_exporter.service' in ansible_facts.services or
               'prometheus-node-exporter.service' in ansible_facts.services or
               'consolecrypt-node-exporter.service' in ansible_facts.services }}
          known_package: >-
            {{ 'prometheus-node-exporter' in ansible_facts.packages or
               'golang-github-prometheus-node-exporter' in ansible_facts.packages }}
          mode: '{{ cc_exporter_mode }}'

    - name: Install only the exact explicitly reviewed new exporter
      when: cc_exporter_mode == 'install'
      become: true
      block:
        - name: Validate reviewed version artifact architecture and loopback endpoint
          ansible.builtin.assert:
            that:
              - cc_node_exporter_version is defined
              - cc_node_exporter_version is string
              - cc_node_exporter_version is match('^[0-9]+\.[0-9]+\.[0-9]+\Z')
              - cc_node_exporter_version | length <= 32
              - cc_node_exporter_sha256 is defined
              - cc_node_exporter_sha256 is string
              - cc_node_exporter_sha256 is match('^[0-9a-f]{64}\Z')
              - cc_node_exporter_arch is defined
              - cc_node_exporter_arch in ['amd64', 'arm64']
              - >-
                (cc_node_exporter_arch == 'amd64' and cc_architecture.stdout == 'x86_64') or
                (cc_node_exporter_arch == 'arm64' and cc_architecture.stdout == 'aarch64')
              - cc_node_exporter_port is defined
              - cc_node_exporter_port is integer
              - cc_node_exporter_port >= 1024
              - cc_node_exporter_port <= 65535
              - cc_existing_paths.results | selectattr('stat.exists') | list | length == 0
              - cc_existing_process.rc == 1
              - "'node_exporter.service' not in ansible_facts.services"
              - "'prometheus-node-exporter.service' not in ansible_facts.services"
              - "'consolecrypt-node-exporter.service' not in ansible_facts.services"
              - "'prometheus-node-exporter' not in ansible_facts.packages"
              - "'golang-github-prometheus-node-exporter' not in ansible_facts.packages"
            fail_msg: Existing or unsupported exporters are never overwritten. Review and use their endpoint separately.

        - name: Require the reviewed loopback port to be unused
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: '{{ cc_node_exporter_port }}'
            state: stopped
            timeout: 1

        - name: Detect a preexisting reserved service user
          ansible.builtin.getent:
            database: passwd
            key: consolecrypt-node-exporter
            fail_key: false
          no_log: true

        - name: Detect a preexisting reserved service group
          ansible.builtin.getent:
            database: group
            key: consolecrypt-node-exporter
            fail_key: false
          no_log: true

        - name: Refuse to repurpose an existing identity
          ansible.builtin.assert:
            that:
              - ansible_facts.getent_passwd['consolecrypt-node-exporter'] is none
              - ansible_facts.getent_group['consolecrypt-node-exporter'] is none
            fail_msg: Existing identities are not reused or modified by this template.

        - name: Create a private temporary artifact directory
          ansible.builtin.tempfile:
            state: directory
            prefix: cc-node-exporter-
          register: cc_node_artifact_dir

        - name: Install the reviewed checksum-verified upstream artifact
          block:
            - name: Download from the fixed upstream release family with exact checksum
              ansible.builtin.get_url:
                url: >-
                  {{ 'https://github.com/prometheus/node_exporter/releases/download/v' ~
                     cc_node_exporter_version ~ '/node_exporter-' ~ cc_node_exporter_version ~
                     '.linux-' ~ cc_node_exporter_arch ~ '.tar.gz' }}
                dest: '{{ cc_node_artifact_dir.path }}/artifact.tar.gz'
                checksum: 'sha256:{{ cc_node_exporter_sha256 }}'
                mode: '0600'
                validate_certs: true
                use_netrc: false
                use_proxy: false
                unredirected_headers: [Authorization]
                timeout: 30

            - name: Extract the checksum-verified archive in its private directory
              ansible.builtin.unarchive:
                src: '{{ cc_node_artifact_dir.path }}/artifact.tar.gz'
                dest: '{{ cc_node_artifact_dir.path }}'
                remote_src: true

            - name: Create a genuinely new dedicated binary directory or fail if raced
              ansible.builtin.command:
                argv: [mkdir, --mode=0755, --, /opt/consolecrypt-node-exporter]
              changed_when: true

            - name: Create a new dedicated service group
              ansible.builtin.group:
                name: consolecrypt-node-exporter
                system: true

            - name: Create a dedicated unprivileged service identity
              ansible.builtin.user:
                name: consolecrypt-node-exporter
                group: consolecrypt-node-exporter
                system: true
                create_home: false
                shell: /usr/sbin/nologin

            - name: Copy the new binary without replacing an existing file
              ansible.builtin.copy:
                src: >-
                  {{ cc_node_artifact_dir.path ~ '/node_exporter-' ~ cc_node_exporter_version ~
                     '.linux-' ~ cc_node_exporter_arch ~ '/node_exporter' }}
                dest: /opt/consolecrypt-node-exporter/node_exporter
                remote_src: true
                force: false
                owner: root
                group: root
                mode: '0755'

            - name: Allocate an owned same-filesystem unit staging file
              ansible.builtin.tempfile:
                state: file
                path: /etc/systemd/system
                prefix: .cc-node-exporter-
              register: cc_node_unit_stage

            - name: Render only this operation unit staging file
              ansible.builtin.template:
                src: node-exporter.service.j2
                dest: '{{ cc_node_unit_stage.path }}'
                owner: root
                group: root
                mode: '0644'

            - name: Publish the owned unit with atomic no-replace hard link or fail
              ansible.builtin.command:
                argv:
                  - ln
                  - --no-target-directory
                  - --
                  - '{{ cc_node_unit_stage.path }}'
                  - /etc/systemd/system/consolecrypt-node-exporter.service
              changed_when: true

            - name: Read source and installed binary and unit hashes without following links
              ansible.builtin.stat:
                path: '{{ item }}'
                follow: false
                checksum_algorithm: sha256
              loop:
                - >-
                  {{ cc_node_artifact_dir.path ~ '/node_exporter-' ~ cc_node_exporter_version ~
                     '.linux-' ~ cc_node_exporter_arch ~ '/node_exporter' }}
                - /opt/consolecrypt-node-exporter/node_exporter
                - '{{ cc_node_unit_stage.path }}'
                - /etc/systemd/system/consolecrypt-node-exporter.service
              register: cc_node_readback

            - name: Never start a differing raced binary unit or link
              ansible.builtin.assert:
                that:
                  - cc_node_readback.results | selectattr('stat.isreg', 'defined') | selectattr('stat.isreg') | list | length == 4
                  - cc_node_readback.results | selectattr('stat.islnk') | list | length == 0
                  - cc_node_readback.results[0].stat.checksum == cc_node_readback.results[1].stat.checksum
                  - cc_node_readback.results[2].stat.checksum == cc_node_readback.results[3].stat.checksum
                  - cc_node_readback.results[1].stat.uid == 0
                  - cc_node_readback.results[1].stat.mode == '0755'
                  - cc_node_readback.results[3].stat.uid == 0
                  - cc_node_readback.results[3].stat.mode == '0644'
                fail_msg: Installed bytes or ownership changed. No service start is allowed.

            - name: Explicitly enable and start the reviewed new loopback service
              ansible.builtin.systemd_service:
                name: consolecrypt-node-exporter.service
                daemon_reload: true
                enabled: true
                state: started
          always:
            - name: Remove only the owned unit staging link when allocated
              ansible.builtin.file:
                path: '{{ cc_node_unit_stage.path }}'
                state: absent
              when: cc_node_unit_stage is defined and cc_node_unit_stage.path is defined

            - name: Remove only this operation temporary artifact directory
              ansible.builtin.file:
                path: '{{ cc_node_artifact_dir.path }}'
                state: absent
