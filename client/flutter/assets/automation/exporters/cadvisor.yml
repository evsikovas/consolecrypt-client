---
- name: Explicit manifest-bound cAdvisor lifecycle through reviewed Ansible jobs
  hosts: all
  gather_facts: false
  become: false
  vars:
    cc_exporter_mode: inspect
    consolecrypt_cadvisor_manifest_definition:
      schemaVersion: 1
      component: cadvisor
      managedBy: reviewedAnsible
      hostId: '{{ consolecrypt_host_id }}'
      owner: '{{ cc_cadvisor_owner }}'
      collectorVersion: '0.60.6'
      imageManifestSha256: '{{ cc_cadvisor_image_sha256 }}'
      imageId: '{{ cc_cadvisor_image_id }}'
      bindIp: 127.0.0.1
      port: '{{ cc_cadvisor_port }}'
      metricsPath: /metrics
    consolecrypt_cadvisor_manifest_digest: '{{ consolecrypt_cadvisor_manifest_definition | to_json(sort_keys=True, separators=[",", ":"], ensure_ascii=True) | hash("sha256") }}'
  tasks:
    - name: Validate explicit operation mode
      ansible.builtin.assert:
        that:
          - cc_exporter_mode in ['inspect', 'install', 'start', 'stop', 'remove']
        fail_msg: Choose one fixed operation and explicitly confirm its ordinary Native job review.

    - name: Read actual kernel family
      ansible.builtin.command:
        argv: [uname, -s]
      register: consolecrypt_kernel
      check_mode: false
      changed_when: false

    - name: Require Linux before interpreting cAdvisor host metadata
      ansible.builtin.assert:
        that:
          - consolecrypt_kernel.stdout == 'Linux'
        fail_msg: This cAdvisor template requires a separately reviewed Linux Docker host.

    - name: Inspect existing local Docker container image names without exposing configuration
      become: '{{ cc_exporter_mode != "inspect" }}'
      ansible.builtin.command:
        argv:
          - docker
          - --host=unix:///var/run/docker.sock
          - container
          - ls
          - --all
          - --format
          - "{{ '{{.Image}}' }}"
      environment:
        DOCKER_CONTEXT: ''
        DOCKER_HOST: unix:///var/run/docker.sock
      register: consolecrypt_existing_images
      check_mode: false
      changed_when: false
      no_log: true

    - name: Inspect reserved container name without changing it
      become: '{{ cc_exporter_mode != "inspect" }}'
      ansible.builtin.command:
        argv:
          - docker
          - --host=unix:///var/run/docker.sock
          - container
          - ls
          - --all
          - --filter
          - name=^/consolecrypt-cadvisor$
          - --format
          - "{{ '{{.ID}}' }}"
      environment:
        DOCKER_CONTEXT: ''
        DOCKER_HOST: unix:///var/run/docker.sock
      register: consolecrypt_reserved_container
      check_mode: false
      changed_when: false
      no_log: true

    - name: Detect a running native cAdvisor
      ansible.builtin.command:
        argv: [pgrep, -x, cadvisor]
      register: consolecrypt_existing_process
      check_mode: false
      changed_when: false
      failed_when: consolecrypt_existing_process.rc not in [0, 1]
      no_log: true

    - name: Read existing service metadata without exposing arguments
      ansible.builtin.service_facts:
      no_log: true

    - name: Detect known native cAdvisor binaries
      ansible.builtin.stat:
        path: '{{ item }}'
        follow: false
      loop:
        - /usr/bin/cadvisor
        - /usr/local/bin/cadvisor
      register: consolecrypt_existing_paths

    - name: Report bounded exporter presence only
      ansible.builtin.debug:
        msg:
          known_image_present: '{{ consolecrypt_existing_images.stdout_lines | select("search", "cadvisor") | list | length > 0 }}'
          reserved_container_present: '{{ consolecrypt_reserved_container.stdout | length > 0 }}'
          running_process: '{{ consolecrypt_existing_process.rc == 0 }}'
          known_binary_present: '{{ consolecrypt_existing_paths.results | selectattr("stat.exists") | list | length > 0 }}'
          mode: '{{ cc_exporter_mode }}'

    - name: Bind the reviewed component manifest to the actual signed Native Host
      when: cc_exporter_mode != 'inspect' or cc_cadvisor_component_manifest is defined
      ansible.builtin.assert:
        that:
          - consolecrypt_host_id is defined
          - consolecrypt_host_id is string
          - consolecrypt_host_id is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\Z')
          - cc_cadvisor_version == '0.60.6'
          - cc_cadvisor_image_sha256 is string and cc_cadvisor_image_sha256 is match('^[0-9a-f]{64}\Z')
          - cc_cadvisor_image_id is string and cc_cadvisor_image_id is match('^sha256:[0-9a-f]{64}\Z')
          - cc_cadvisor_owner is string and cc_cadvisor_owner is match('^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\Z')
          - cc_cadvisor_port is integer and cc_cadvisor_port >= 1024 and cc_cadvisor_port <= 65535
          - cc_cadvisor_host_access == 'privileged-host-filesystems-and-kmsg'
          - cc_cadvisor_component_manifest | default(consolecrypt_cadvisor_manifest_definition) == consolecrypt_cadvisor_manifest_definition
          - cc_cadvisor_manifest_sha256 | default(consolecrypt_cadvisor_manifest_digest) == consolecrypt_cadvisor_manifest_digest
        fail_msg: The exact component manifest and actual signed Host must match. Manifest metadata is not an execution or metrics-read grant.

    - name: Install only an explicitly reviewed privileged host-metrics container
      when: cc_exporter_mode == 'install'
      become: true
      block:
        - name: Validate reviewed immutable artifact and declared host access
          ansible.builtin.assert:
            that:
              - cc_cadvisor_version is defined
              - cc_cadvisor_version is string
              - cc_cadvisor_version == '0.60.6'
              - cc_cadvisor_version | length <= 32
              - cc_cadvisor_image_sha256 is defined
              - cc_cadvisor_image_sha256 is string
              - cc_cadvisor_image_sha256 is match('^[0-9a-f]{64}\Z')
              - cc_cadvisor_image_id is defined
              - cc_cadvisor_image_id is string
              - cc_cadvisor_image_id is match('^sha256:[0-9a-f]{64}\Z')
              - cc_cadvisor_owner is defined
              - cc_cadvisor_owner is string
              - cc_cadvisor_owner is match('^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\Z')
              - cc_cadvisor_port is defined
              - cc_cadvisor_port is integer
              - cc_cadvisor_port >= 1024
              - cc_cadvisor_port <= 65535
              - cc_cadvisor_host_access is defined
              - cc_cadvisor_host_access == 'privileged-host-filesystems-and-kmsg'
              - consolecrypt_existing_images.stdout | length <= 32768
              - consolecrypt_existing_images.stdout_lines | length <= 256
              - consolecrypt_existing_images.stdout_lines | select('search', 'cadvisor') | list | length == 0
              - consolecrypt_reserved_container.stdout | length == 0
              - consolecrypt_existing_process.rc == 1
              - consolecrypt_existing_paths.results | selectattr('stat.exists') | list | length == 0
              - "'cadvisor.service' not in ansible_facts.services"
              - "'consolecrypt-cadvisor.service' not in ansible_facts.services"
            fail_msg: >-
              This is a privileged Docker host-filesystem and device-access installation.
              Review the complete fixed mounts and flags in this source and the exact artifact.
              Existing exporters or containers are never overwritten. This parameter is not an access grant.

        - name: Require the reviewed loopback listener port to be unused
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: '{{ cc_cadvisor_port }}'
            state: stopped
            timeout: 1

        - name: Check fixed upstream host mount and device prerequisites without creating them
          ansible.builtin.stat:
            path: '{{ item }}'
            follow: true
          loop:
            - /var/run
            - /sys
            - /var/lib/docker
            - /dev/disk
            - /dev/kmsg
          register: consolecrypt_host_mounts

        - name: Reject unsupported host layouts instead of changing them
          ansible.builtin.assert:
            that:
              - consolecrypt_host_mounts.results | selectattr('stat.exists') | list | length == 5
            fail_msg: Required reviewed cAdvisor host paths are missing. No directories or devices will be fabricated.

        - name: Allocate an isolated empty Docker client configuration
          ansible.builtin.tempfile:
            path: /tmp
            state: directory
            prefix: cc-cadvisor-config-
          register: consolecrypt_cadvisor_docker_config

        - name: Write only this operation empty Docker client configuration
          ansible.builtin.copy:
            dest: '{{ consolecrypt_cadvisor_docker_config.path }}/config.json'
            content: '{}'
            mode: '0600'

        - name: Require the exact independently supplied local image without pulling
          ansible.builtin.command:
            argv:
              - docker
              - '--config={{ consolecrypt_cadvisor_docker_config.path }}'
              - --host=unix:///var/run/docker.sock
              - image
              - inspect
              - --format
              - "{{ '{{json .Id}} {{json .RepoDigests}}' }}"
              - 'ghcr.io/google/cadvisor@sha256:{{ cc_cadvisor_image_sha256 }}'
          environment:
            DOCKER_CONTEXT: ''
            DOCKER_HOST: unix:///var/run/docker.sock
            DOCKER_CONFIG: '{{ consolecrypt_cadvisor_docker_config.path }}'
            DOCKER_CUSTOM_HEADERS: ''
          register: consolecrypt_local_image
          changed_when: false
          timeout: 10
          no_log: true

        - name: Check actual config-image identity and manifest association
          ansible.builtin.assert:
            that:
              - consolecrypt_local_image.stdout | length <= 8192
              - consolecrypt_local_image.stdout == ((cc_cadvisor_image_id | to_json) ~ ' ' ~ (['ghcr.io/google/cadvisor@sha256:' ~ cc_cadvisor_image_sha256] | to_json))
            fail_msg: The exact image ID and sole reviewed repository digest must already be installed by the administrator. No pull or tag fallback is permitted.

        - name: Explicitly start the new container with the reviewed privileged host mounts
          ansible.builtin.command:
            argv:
              - docker
              - '--config={{ consolecrypt_cadvisor_docker_config.path }}'
              - --host=unix:///var/run/docker.sock
              - container
              - run
              - --pull=never
              - --detach
              - --name=consolecrypt-cadvisor
              - --restart=unless-stopped
              - '--label=io.consolecrypt.component=cadvisor'
              - '--label=io.consolecrypt.owner={{ cc_cadvisor_owner }}'
              - '--label=io.consolecrypt.host={{ consolecrypt_host_id }}'
              - '--label=io.consolecrypt.managed-by=reviewedAnsible'
              - '--label=io.consolecrypt.manifest={{ consolecrypt_cadvisor_manifest_digest }}'
              - --memory=536870912
              - --memory-swap=536870912
              - --cpus=1
              - --pids-limit=128
              - --log-driver=local
              - --log-opt=max-size=16m
              - --log-opt=max-file=2
              - '--publish=127.0.0.1:{{ cc_cadvisor_port }}:8080'
              - --privileged
              - --device=/dev/kmsg
              - --volume=/:/rootfs:ro
              - --volume=/var/run:/var/run:ro
              - --volume=/sys:/sys:ro
              - --volume=/var/lib/docker:/var/lib/docker:ro
              - --volume=/dev/disk:/dev/disk:ro
              - 'ghcr.io/google/cadvisor@sha256:{{ cc_cadvisor_image_sha256 }}'
              - --port=8080
              - --store_container_labels=false
              - --max_procs=1
          environment:
            DOCKER_CONTEXT: ''
            DOCKER_HOST: unix:///var/run/docker.sock
            DOCKER_CONFIG: '{{ consolecrypt_cadvisor_docker_config.path }}'
            DOCKER_CUSTOM_HEADERS: ''
          register: consolecrypt_new_container
          changed_when: true
          timeout: 30
          no_log: true

        - name: Capture only this successful start exact container ID
          ansible.builtin.assert:
            that:
              - consolecrypt_new_container.stdout is match('^[0-9a-f]{64}\Z')
            fail_msg: Container identity was not returned. State is unknown and is preserved for explicit operator review.

        - name: Read only fixed public metadata from this actual container
          ansible.builtin.command:
            argv:
              - docker
              - '--config={{ consolecrypt_cadvisor_docker_config.path }}'
              - --host=unix:///var/run/docker.sock
              - container
              - inspect
              - --format
              - '{{ consolecrypt_readback_format }}'
              - '{{ consolecrypt_new_container.stdout }}'
          vars:
            consolecrypt_readback_format: !unsafe >-
              {"id":{{json .Id}},"name":{{json .Name}},"imageRef":{{json .Config.Image}},"host":{{json (index .Config.Labels "io.consolecrypt.host")}},"managedBy":{{json (index .Config.Labels "io.consolecrypt.managed-by")}},"manifestSha256":{{json (index .Config.Labels "io.consolecrypt.manifest")}},"image":{{json .Image}},"owner":{{json (index .Config.Labels "io.consolecrypt.owner")}},"component":{{json (index .Config.Labels "io.consolecrypt.component")}},"running":{{json .State.Running}},"oom":{{json .State.OOMKilled}},"memory":{{json .HostConfig.Memory}},"swap":{{json .HostConfig.MemorySwap}},"cpu":{{json .HostConfig.NanoCpus}},"pids":{{json .HostConfig.PidsLimit}},"privileged":{{json .HostConfig.Privileged}},"restart":{{json .HostConfig.RestartPolicy.Name}},"ports":{{json .HostConfig.PortBindings}},"logs":{{json .HostConfig.LogConfig}},"mounts":{{json .Mounts}}}
          environment:
            DOCKER_CONTEXT: ''
            DOCKER_HOST: unix:///var/run/docker.sock
            DOCKER_CONFIG: '{{ consolecrypt_cadvisor_docker_config.path }}'
            DOCKER_CUSTOM_HEADERS: ''
          register: consolecrypt_public_readback
          changed_when: false
          timeout: 10
          no_log: true

        - name: Validate this operation actual resource and ownership readback
          vars:
            consolecrypt_actual: '{{ consolecrypt_public_readback.stdout | from_json }}'
            consolecrypt_cadvisor_observation: '{{ consolecrypt_public_readback }}'
            consolecrypt_expected_container_id: '{{ consolecrypt_new_container.stdout }}'
          ansible.builtin.assert:
            that: &cc_cadvisor_owned_constraints
              - consolecrypt_cadvisor_observation.stdout | length <= 16384
              - consolecrypt_actual.id == consolecrypt_expected_container_id
              - consolecrypt_actual.image == cc_cadvisor_image_id
              - consolecrypt_actual.owner == cc_cadvisor_owner
              - consolecrypt_actual.name == '/consolecrypt-cadvisor'
              - consolecrypt_actual.imageRef == 'ghcr.io/google/cadvisor@sha256:' ~ cc_cadvisor_image_sha256
              - consolecrypt_actual.host == consolecrypt_host_id
              - consolecrypt_actual.managedBy == 'reviewedAnsible'
              - consolecrypt_actual.manifestSha256 == consolecrypt_cadvisor_manifest_digest
              - consolecrypt_actual.component == 'cadvisor'
              - consolecrypt_actual.running is boolean
              - consolecrypt_actual.oom is boolean
              - consolecrypt_actual.memory == 536870912
              - consolecrypt_actual.swap == 536870912
              - consolecrypt_actual.cpu == 1000000000
              - consolecrypt_actual.pids == 128
              - consolecrypt_actual.privileged == true
              - consolecrypt_actual.restart == 'unless-stopped'
              - consolecrypt_actual.ports == {'8080/tcp':[{'HostIp':'127.0.0.1','HostPort':cc_cadvisor_port | string}]}
              - consolecrypt_actual.logs == {'Type':'local','Config':{'max-size':'16m','max-file':'2'}}
              - consolecrypt_actual.mounts | length == 5
              - consolecrypt_actual.mounts | selectattr('Type','equalto','bind') | list | length == 5
              - consolecrypt_actual.mounts | selectattr('RW','equalto',false) | list | length == 5
              - consolecrypt_actual.mounts | map(attribute='Source') | sort | list == ['/', '/dev/disk', '/sys', '/var/lib/docker', '/var/run']
              - consolecrypt_actual.mounts | map(attribute='Destination') | sort | list == ['/dev/disk', '/rootfs', '/sys', '/var/lib/docker', '/var/run']
              - consolecrypt_actual.mounts | selectattr('Source','equalto','/') | selectattr('Destination','equalto','/rootfs') | list | length == 1
              - consolecrypt_actual.mounts | selectattr('Source','equalto','/var/run') | selectattr('Destination','equalto','/var/run') | list | length == 1
              - consolecrypt_actual.mounts | selectattr('Source','equalto','/sys') | selectattr('Destination','equalto','/sys') | list | length == 1
              - consolecrypt_actual.mounts | selectattr('Source','equalto','/var/lib/docker') | selectattr('Destination','equalto','/var/lib/docker') | list | length == 1
              - consolecrypt_actual.mounts | selectattr('Source','equalto','/dev/disk') | selectattr('Destination','equalto','/dev/disk') | list | length == 1
            fail_msg: Actual owned installation readback differs from the reviewed profile. State is preserved; no binding or freshness is claimed.
          no_log: true

        - name: Require the freshly installed original container to be running
          ansible.builtin.assert:
            that:
              - (consolecrypt_public_readback.stdout | from_json).running == true
              - (consolecrypt_public_readback.stdout | from_json).oom == false

        - name: Wait only for this loopback listener
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: '{{ cc_cadvisor_port }}'
            state: started
            timeout: 15

        - name: Report installation metadata only, never metric or Host authority
          ansible.builtin.debug:
            msg:
              component: cadvisor
              managedBy: reviewedAnsible
              component_manifest: '{{ consolecrypt_cadvisor_manifest_definition }}'
              manifest_sha256: '{{ consolecrypt_cadvisor_manifest_digest }}'
              container_id: '{{ consolecrypt_new_container.stdout }}'
              observed_state: running
              agent_manifest_updated: false
              ownership_checked: true
              configured_resource_limits_checked: true
              loopback_listener_reachable: true
              fresh_metrics_verified: false
              host_binding_created: false

      always:
        - name: Remove only this operation Docker client configuration
          when: consolecrypt_cadvisor_docker_config is defined and consolecrypt_cadvisor_docker_config.path is defined
          ansible.builtin.file:
            path: '{{ consolecrypt_cadvisor_docker_config.path }}'
            state: absent

    - name: Inspect or change only the manifest-bound original owned container
      when: cc_exporter_mode in ['start', 'stop', 'remove'] or (cc_exporter_mode == 'inspect' and cc_cadvisor_component_manifest is defined)
      become: '{{ cc_exporter_mode != "inspect" }}'
      vars:
        consolecrypt_expected_container_id: '{{ cc_cadvisor_container_id }}'
        consolecrypt_owned_format: !unsafe >-
          {"id":{{json .Id}},"name":{{json .Name}},"imageRef":{{json .Config.Image}},"host":{{json (index .Config.Labels "io.consolecrypt.host")}},"managedBy":{{json (index .Config.Labels "io.consolecrypt.managed-by")}},"manifestSha256":{{json (index .Config.Labels "io.consolecrypt.manifest")}},"image":{{json .Image}},"owner":{{json (index .Config.Labels "io.consolecrypt.owner")}},"component":{{json (index .Config.Labels "io.consolecrypt.component")}},"running":{{json .State.Running}},"oom":{{json .State.OOMKilled}},"memory":{{json .HostConfig.Memory}},"swap":{{json .HostConfig.MemorySwap}},"cpu":{{json .HostConfig.NanoCpus}},"pids":{{json .HostConfig.PidsLimit}},"privileged":{{json .HostConfig.Privileged}},"restart":{{json .HostConfig.RestartPolicy.Name}},"ports":{{json .HostConfig.PortBindings}},"logs":{{json .HostConfig.LogConfig}},"mounts":{{json .Mounts}}}
      block:
        - name: Require an explicit complete original container ID
          ansible.builtin.assert:
            that:
              - cc_cadvisor_container_id is defined
              - cc_cadvisor_container_id is string
              - cc_cadvisor_container_id is match('^[0-9a-f]{64}\Z')
            fail_msg: Copy the exact container ID from its original successful job. Names and discovered foreign containers are never adopted.

        - name: Allocate only this operation empty Docker configuration
          ansible.builtin.tempfile:
            path: /tmp
            state: directory
            prefix: cc-cadvisor-config-
          register: consolecrypt_owned_docker_config
          check_mode: false

        - name: Isolate the Docker client from user configuration
          ansible.builtin.copy:
            dest: '{{ consolecrypt_owned_docker_config.path }}/config.json'
            content: '{}'
            mode: '0600'
          check_mode: false

        - name: Read exact original container public state before any mutation
          ansible.builtin.command:
            argv:
              - docker
              - '--config={{ consolecrypt_owned_docker_config.path }}'
              - --host=unix:///var/run/docker.sock
              - container
              - inspect
              - --format
              - '{{ consolecrypt_owned_format }}'
              - '{{ cc_cadvisor_container_id }}'
          environment: &cc_owned_docker_environment
            DOCKER_CONTEXT: ''
            DOCKER_HOST: unix:///var/run/docker.sock
            DOCKER_CONFIG: '{{ consolecrypt_owned_docker_config.path }}'
            DOCKER_CUSTOM_HEADERS: ''
          register: consolecrypt_owned_before
          check_mode: false
          changed_when: false
          timeout: 10
          no_log: true

        - name: Deny foreign identity, image, labels, port, mounts or resource settings
          vars:
            consolecrypt_actual: '{{ consolecrypt_owned_before.stdout | from_json }}'
            consolecrypt_cadvisor_observation: '{{ consolecrypt_owned_before }}'
          ansible.builtin.assert:
            that: *cc_cadvisor_owned_constraints
            fail_msg: Exact original container and manifest do not agree. No start, stop or removal is permitted.
          no_log: true

        - name: Require the owned container to be stopped before removal
          when: cc_exporter_mode == 'remove'
          ansible.builtin.assert:
            that:
              - (consolecrypt_owned_before.stdout | from_json).running == false
            fail_msg: Explicitly stop the original owned container in a separate reviewed job before removal. Force removal is forbidden.

        - name: Preserve any unrelated holder of the reviewed listener port
          when: cc_exporter_mode == 'start' and not (consolecrypt_owned_before.stdout | from_json).running
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: '{{ cc_cadvisor_port }}'
            state: stopped
            timeout: 1

        - name: Start only the already verified original container ID
          when: cc_exporter_mode == 'start' and not (consolecrypt_owned_before.stdout | from_json).running
          ansible.builtin.command:
            argv: [docker, '--config={{ consolecrypt_owned_docker_config.path }}', --host=unix:///var/run/docker.sock, container, start, '{{ cc_cadvisor_container_id }}']
          environment: *cc_owned_docker_environment
          timeout: 20
          changed_when: true
          no_log: true

        - name: Stop only the already verified original container ID
          when: cc_exporter_mode == 'stop' and (consolecrypt_owned_before.stdout | from_json).running
          ansible.builtin.command:
            argv: [docker, '--config={{ consolecrypt_owned_docker_config.path }}', --host=unix:///var/run/docker.sock, container, stop, --time=10, '{{ cc_cadvisor_container_id }}']
          environment: *cc_owned_docker_environment
          timeout: 20
          changed_when: true
          no_log: true

        - name: Remove only the stopped verified container without volumes or force
          when: cc_exporter_mode == 'remove'
          ansible.builtin.command:
            argv: [docker, '--config={{ consolecrypt_owned_docker_config.path }}', --host=unix:///var/run/docker.sock, container, rm, '{{ cc_cadvisor_container_id }}']
          environment: *cc_owned_docker_environment
          timeout: 20
          changed_when: true
          no_log: true

        - name: Read actual public state after inspection, start or stop
          when: cc_exporter_mode != 'remove' or ansible_check_mode
          ansible.builtin.command:
            argv: [docker, '--config={{ consolecrypt_owned_docker_config.path }}', --host=unix:///var/run/docker.sock, container, inspect, --format, '{{ consolecrypt_owned_format }}', '{{ cc_cadvisor_container_id }}']
          environment: *cc_owned_docker_environment
          register: consolecrypt_owned_after
          check_mode: false
          changed_when: false
          timeout: 10
          no_log: true

        - name: Verify the same owned definition after the operation
          when: cc_exporter_mode != 'remove' or ansible_check_mode
          vars:
            consolecrypt_actual: '{{ consolecrypt_owned_after.stdout | from_json }}'
            consolecrypt_cadvisor_observation: '{{ consolecrypt_owned_after }}'
          ansible.builtin.assert:
            that: *cc_cadvisor_owned_constraints
          no_log: true

        - name: Verify requested start or stop from actual state only
          when: not ansible_check_mode and cc_exporter_mode in ['start', 'stop']
          ansible.builtin.assert:
            that:
              - (consolecrypt_owned_after.stdout | from_json).running == (cc_exporter_mode == 'start')

        - name: Observe the actual listener state after start or stop
          when: not ansible_check_mode and cc_exporter_mode in ['start', 'stop']
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: '{{ cc_cadvisor_port }}'
            state: '{{ "started" if cc_exporter_mode == "start" else "stopped" }}'
            timeout: 15

        - name: Check absence of only the original removed ID
          when: cc_exporter_mode == 'remove' and not ansible_check_mode
          ansible.builtin.command:
            argv: [docker, '--config={{ consolecrypt_owned_docker_config.path }}', --host=unix:///var/run/docker.sock, container, ls, --all, --no-trunc, '--filter=id={{ cc_cadvisor_container_id }}', --format, '{{ consolecrypt_removed_format }}']
          vars:
            consolecrypt_removed_format: !unsafe '{{.ID}}'
          environment: *cc_owned_docker_environment
          register: consolecrypt_owned_absence
          check_mode: false
          changed_when: false
          timeout: 10
          no_log: true

        - name: Require actual absence after removal
          when: cc_exporter_mode == 'remove' and not ansible_check_mode
          ansible.builtin.assert:
            that:
              - consolecrypt_owned_absence.stdout == ''

        - name: Report actual observation without claiming Agent collection or data deletion
          ansible.builtin.debug:
            msg:
              component: cadvisor
              managedBy: reviewedAnsible
              component_manifest: '{{ consolecrypt_cadvisor_manifest_definition }}'
              manifest_sha256: '{{ consolecrypt_cadvisor_manifest_digest }}'
              container_id: '{{ cc_cadvisor_container_id }}'
              requested_operation: '{{ cc_exporter_mode }}'
              check_mode: '{{ ansible_check_mode }}'
              observed_state: '{{ "removed" if cc_exporter_mode == "remove" and not ansible_check_mode else ("running" if (consolecrypt_owned_after.stdout | from_json).running else "stopped") }}'
              volumes_removed: false
              host_bind_paths_deleted_by_job: false
              fresh_metrics_verified: false
              agent_manifest_updated: false

      always:
        - name: Remove only this operation temporary Docker client configuration
          when: consolecrypt_owned_docker_config is defined and consolecrypt_owned_docker_config.path is defined
          ansible.builtin.file:
            path: '{{ consolecrypt_owned_docker_config.path }}'
            state: absent
          check_mode: false
