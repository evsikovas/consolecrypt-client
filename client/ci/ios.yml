# Opt-in previews: no Apple account, provisioning profile or signing secret.
ios-regression:
  stage: build
  tags: [macos, arm64]
  resource_group: consolecrypt-macos
  timeout: 3h
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
  script:
    - bash client/scripts/ci-ios.sh --test-only

build-ios-preview:
  stage: build
  tags: [macos, arm64]
  resource_group: consolecrypt-macos
  timeout: 3h
  rules:
    - if: '$CI_COMMIT_BRANCH == "codex/rdp-0.3-source"'
      when: on_success
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
  script:
    - python3 -m unittest discover -s client/scripts -p 'test_release_ci.py' -v
    - python3 -m unittest discover -s client/scripts -p 'test_ios_preview_archive.py' -v
    - bash client/scripts/ci-ios.sh --build-only
  artifacts:
    name: "ConsoleCrypt-ios-simulator-$CI_COMMIT_SHORT_SHA"
    when: always
    paths:
      - dist/ios/ci-preview/ConsoleCrypt-ios-preview.json
      - dist/ios/ci-preview/SHA256SUMS-ios-preview.txt
      - dist/ios/ci-preview/README-ios-preview.txt
    expire_in: 90 days
