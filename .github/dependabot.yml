# Version-update PRs are off (open-pull-requests-limit: 0): dependencies are
# bumped by hand from issues. Dependabot alerts and security updates are off
# in the repository settings; vulnerable dependencies are reported by the
# weekly dependency-audit.yml issue instead. The schedule, groups and ignores stay so version updates can be turned
# back on by raising the limit. Dependabot PRs run only the hosted
# dependency-audit.yml checks: no workflow here schedules self-hosted
# runners on pull_request.
version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /client/rust
      - /crates
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      cargo-patch:
        update-types: [patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Pinned by revision to a released server commit; bumped by hand with the protocol.
      - dependency-name: cc-protocol

  - package-ecosystem: pub
    directory: /client/flutter
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      pub-patch:
        update-types: [patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      actions-patch:
        update-types: [patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
