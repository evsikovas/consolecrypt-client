name: ConsoleCrypt desktop and Android preview

on:
  push:
    branches: ['preview/port-check-93016']

permissions:
  contents: read

jobs:
  macos:
    if: github.repository == 'evsikovas/consolecrypt-client'
    runs-on: [self-hosted, macOS, ARM64, consolecrypt, client]
    timeout-minutes: 240
    env:
      CC_BUILD_NUMBER: '93026'
      CC_CODESIGN_IDENTITY: ${{ vars.CC_CODESIGN_IDENTITY }}
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: false
          persist-credentials: false
      - name: Load the native toolchain
        run: source client/scripts/ci-macos-tools.sh --xcode
      - name: Check macOS TCP and UDP socket tables
        run: |
          python3 - <<'PY'
          import socket
          import subprocess
          for kind, protocol in [(socket.SOCK_STREAM, "tcp"), (socket.SOCK_DGRAM, "udp")]:
              with socket.socket(type=kind) as service:
                  service.bind(("127.0.0.1", 0))
                  if protocol == "tcp":
                      service.listen()
                  port = str(service.getsockname()[1])
                  output = subprocess.check_output(["/bin/sh", "client/rust/app-core/src/listening_ports.sh",
                                                    protocol, port, port], text=True)
                  assert output.splitlines() == [port], (protocol, port, output)
                  owners = subprocess.check_output(["/bin/sh", "client/rust/app-core/src/socket_owner.sh",
                                                    protocol, port], text=True)
                  assert owners.strip(), (protocol, port, "missing process name")
          PY
      - name: Build and verify the universal disk image
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- client/flutter/pubspec.yaml client/flutter/lib/app/app_info.dart
          caffeinate -i bash client/scripts/build-macos.sh
          cd dist/macos
          version=$(cat ConsoleCrypt.version)
          [[ "$version" == "1.2.5+$CC_BUILD_NUMBER" ]]
          codesign --verify --deep --strict ConsoleCrypt.app
          for binary in ConsoleCrypt.app/Contents/MacOS/ConsoleCrypt \
                        ConsoleCrypt.app/Contents/Frameworks/cc_bridge.framework/Versions/A/cc_bridge \
                        ConsoleCrypt.app/Contents/Helpers/consolecrypt-cli; do
            architectures=$(lipo -archs "$binary")
            echo "$binary: $architectures"
            for architecture in arm64 x86_64; do
              if [[ " $architectures " != *" $architecture "* ]]; then
                echo "Missing $architecture in $binary" >&2
                exit 1
              fi
            done
          done
          hdiutil verify ConsoleCrypt.dmg
          package="ConsoleCrypt-$version-macos-universal.dmg"
          cp ConsoleCrypt.dmg "$package"
          shasum -a 256 "$package" > SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: port-check-macos-universal
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            dist/macos/ConsoleCrypt-1.2.5+93026-macos-universal.dmg
            dist/macos/SHA256SUMS-macos.txt

  android:
    needs: macos
    if: "!cancelled() && !contains(github.event.head_commit.message, '[desktop-only]') && github.repository == 'evsikovas/consolecrypt-client'"
    runs-on: [self-hosted, macOS, ARM64, consolecrypt, client]
    timeout-minutes: 180
    env:
      CC_BUILD_NUMBER: '93026'
      CARGO_BUILD_JOBS: '3'
      ANDROID_HOME: ${{ vars.ANDROID_HOME }}
      JAVA_HOME: ${{ vars.JAVA_HOME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: false
          persist-credentials: false
      - name: Native toolchain
        run: source client/scripts/ci-macos-tools.sh
      - name: Build direct ARM64 APK
        run: |
          git restore --source=HEAD -- client/flutter/pubspec.yaml client/flutter/lib/app/app_info.dart
          caffeinate -i bash client/scripts/build-android.sh
      - name: Verify preview identity, version and checksum
        run: |
          set -euo pipefail
          cd dist/android
          version=$(cat ConsoleCrypt.version)
          [[ "$version" == '1.2.5+93026' ]]
          apk=ConsoleCrypt-android-arm64.apk
          tools="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}/build-tools/36.0.0"
          badging=$("$tools/aapt" dump badging "$apk")
          grep -Fq "package: name='io.consolecrypt.consolecrypt' versionCode='93026' versionName='1.2.5'" <<< "$badging"
          grep -Eq "^native-code: 'arm64-v8a'[[:space:]]*$" <<< "$badging"
          signatures=$("$tools/apksigner" verify --print-certs "$apk")
          signer=$(sed -nE 's/^Signer #[0-9]+ certificate SHA-256 digest: ([0-9a-f]+)$/\1/p' <<< "$signatures")
          [[ "$signer" == 26c5639c133881b103123361eb19d226c0dc0dce19eafa26c661862847d8e485 ]]
          package="ConsoleCrypt-$version-android-arm64.apk"
          cp "$apk" "$package"
          shasum -a 256 "$package" > SHA256SUMS-android.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-preview-93026
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/android/ConsoleCrypt-1.2.5+93026-android-arm64.apk
            dist/android/SHA256SUMS-android.txt
            dist/android/ConsoleCrypt.version
