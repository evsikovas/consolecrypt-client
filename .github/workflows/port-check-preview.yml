name: Port check macOS preview

on:
  push:
    branches: ['preview/port-check-93016']

permissions:
  contents: read

jobs:
  macos:
    if: github.repository == 'evsikovas/consolecrypt-client'
    runs-on: [self-hosted, macOS, ARM64, consolecrypt, client]
    timeout-minutes: 240
    env:
      CC_BUILD_NUMBER: '93020'
      CC_CODESIGN_IDENTITY: ${{ vars.CC_CODESIGN_IDENTITY }}
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: false
          persist-credentials: false
      - name: Load the native toolchain
        run: source client/scripts/ci-macos-tools.sh --xcode
      - name: Check macOS TCP and UDP socket tables
        run: |
          python3 - <<'PY'
          import socket
          import subprocess
          for kind, protocol in [(socket.SOCK_STREAM, "tcp"), (socket.SOCK_DGRAM, "udp")]:
              with socket.socket(type=kind) as service:
                  service.bind(("127.0.0.1", 0))
                  if protocol == "tcp":
                      service.listen()
                  port = str(service.getsockname()[1])
                  output = subprocess.check_output(["/bin/sh", "client/rust/app-core/src/listening_ports.sh",
                                                    protocol, port, port], text=True)
                  assert output.splitlines() == [port], (protocol, port, output)
                  owners = subprocess.check_output(["/bin/sh", "client/rust/app-core/src/socket_owner.sh",
                                                    protocol, port], text=True)
                  assert owners.strip(), (protocol, port, "missing process name")
          PY
      - name: Build and verify the universal disk image
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- client/flutter/pubspec.yaml client/flutter/lib/app/app_info.dart
          caffeinate -i bash client/scripts/build-macos.sh
          cd dist/macos
          version=$(cat ConsoleCrypt.version)
          [[ "$version" == "1.2.5+$CC_BUILD_NUMBER" ]]
          codesign --verify --deep --strict ConsoleCrypt.app
          for binary in ConsoleCrypt.app/Contents/MacOS/ConsoleCrypt \
                        ConsoleCrypt.app/Contents/Frameworks/cc_bridge.framework/Versions/A/cc_bridge \
                        ConsoleCrypt.app/Contents/Helpers/consolecrypt-cli; do
            lipo -verify_arch arm64 x86_64 "$binary"
          done
          hdiutil verify ConsoleCrypt.dmg
          package="ConsoleCrypt-$version-macos-universal.dmg"
          cp ConsoleCrypt.dmg "$package"
          shasum -a 256 "$package" > SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: port-check-macos-universal
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            dist/macos/ConsoleCrypt-1.2.5+93020-macos-universal.dmg
            dist/macos/SHA256SUMS-macos.txt
