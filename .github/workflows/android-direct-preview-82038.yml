name: Android direct preview 82038

on:
  push:
    branches: ['ci/android-direct-preview-82038']

permissions:
  contents: read

jobs:
  android:
    if: github.repository == 'evsikovas/consolecrypt-client'
    runs-on: [self-hosted, macOS, ARM64, consolecrypt, client]
    timeout-minutes: 180
    env:
      CC_BUILD_NUMBER: '82038'
      CARGO_BUILD_JOBS: '3'
      ANDROID_HOME: ${{ vars.ANDROID_HOME }}
      JAVA_HOME: ${{ vars.JAVA_HOME }}
    defaults:
      run:
        shell: bash
        working-directory: android-preview-82038
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: android-preview-82038
          persist-credentials: false
      - name: Native toolchain
        run: source client/scripts/ci-macos-tools.sh
      - name: Build direct ARM64 APK
        run: caffeinate -i bash client/scripts/build-android.sh
      - name: Verify preview identity, version and checksum
        run: |
          set -euo pipefail
          cd dist/android
          version=$(cat ConsoleCrypt.version)
          [[ "$version" == '1.2.1+82038' ]]
          apk=ConsoleCrypt-android-arm64.apk
          tools="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}/build-tools/36.0.0"
          badging=$("$tools/aapt" dump badging "$apk")
          grep -Fq "package: name='io.consolecrypt.consolecrypt' versionCode='82038' versionName='1.2.1'" <<< "$badging"
          grep -Eq "^native-code: 'arm64-v8a'[[:space:]]*$" <<< "$badging"
          signatures=$("$tools/apksigner" verify --print-certs "$apk")
          signer=$(sed -nE 's/^Signer #[0-9]+ certificate SHA-256 digest: ([0-9a-f]+)$/\1/p' <<< "$signatures")
          [[ "$signer" == 26c5639c133881b103123361eb19d226c0dc0dce19eafa26c661862847d8e485 ]]
          package="ConsoleCrypt-$version-android-arm64.apk"
          cp "$apk" "$package"
          shasum -a 256 "$package" > SHA256SUMS-android.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-preview-82038
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            android-preview-82038/dist/android/ConsoleCrypt-1.2.1+82038-android-arm64.apk
            android-preview-82038/dist/android/SHA256SUMS-android.txt
            android-preview-82038/dist/android/ConsoleCrypt.version
