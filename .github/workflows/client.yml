name: Client tag release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

# No pull_request / pull_request_target trigger on persistent native runners.
# A hosted guard checks the tag and main ancestry before native runners start.
permissions:
  contents: read

concurrency:
  group: consolecrypt-client-packages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: github.repository == 'evsikovas/consolecrypt-client'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tag and main ancestry
        id: tag
        run: python3 client/scripts/verify-github-tag.py
      - name: Test release boundaries
        run: |
          python3 -m unittest discover -s client/scripts -p 'test_github_release.py' -v
          python3 -m unittest discover -s client/scripts -p 'test_announce_telegram.py' -v
          python3 -m unittest discover -s client/scripts -p 'test_announce_evsikovnet.py' -v
          python3 -m unittest discover -s client/scripts -p 'test_release_docs.py' -v
          python3 -m unittest discover -s client/scripts -p 'test_live_stand.py' -v
          python3 -m unittest discover -s client/scripts -p 'test_ci_cleanup.py' -v
          python3 -m unittest discover -s client/scripts -p 'test_cleanup_policy.py' -v
          python3 -m unittest discover -s client/scripts -p 'test_linux_cleanup.py' -v
          python3 -m unittest discover -s client/scripts -p 'test_dependency_audit.py' -v
          python3 -m unittest discover -s client/scripts/tests -p 'test_kubernetes_ci.py' -v
      # Hosted runner only: a vulnerable, yanked, banned or unlicensed dependency
      # stops the release before any self-hosted packaging job starts.
      - name: Dependency audit (cargo-deny, osv-scanner)
        run: |
          python3 client/scripts/dependency-audit.py install "$RUNNER_TEMP/audit-tools" cargo-deny osv-scanner
          PATH="$RUNNER_TEMP/audit-tools:$PATH" python3 client/scripts/dependency-audit.py check

  macos:
    needs: validate
    runs-on: ${{ fromJSON(vars.MACOS_BUILD_RUNNER || '["self-hosted","macOS","ARM64","consolecrypt","client"]') }}
    timeout-minutes: 180
    env:
      CC_CODESIGN_IDENTITY: ${{ vars.CC_CODESIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false
      - name: Register this release workspace
        run: python3 client/scripts/cleanup-ci-workspace.py --workspace "$GITHUB_WORKSPACE" --claim-workspace
      - name: Native toolchain and version
        run: |
          source client/scripts/ci-macos-tools.sh --xcode
          python3 client/scripts/github-build-number.py macos
      - name: Regression checks
        run: |
          cargo test --manifest-path client/rust/Cargo.toml --locked -p cc-terminal-core -p cc-k8s-core -p cc-app-core --all-targets
          python3 -m unittest discover -s client/scripts -p 'test_*version.py' -v
          python3 -m unittest discover -s client/scripts -p 'test_github_build_number.py' -v
          python3 -m unittest discover -s client/scripts -p 'test_release_identity.py' -v
          python3 client/scripts/verify-release-identity.py
          cd client/flutter
          flutter pub get
          flutter analyze
          flutter test
      - name: Build universal macOS installer
        run: |
          bash client/scripts/build-macos.sh --no-cli
          version="$(cat dist/macos/ConsoleCrypt.version)"
          cp dist/macos/ConsoleCrypt.dmg "dist/macos/ConsoleCrypt-$version-macos-universal.dmg"
          cd dist/macos
          shasum -a 256 "ConsoleCrypt-$version-macos-universal.dmg" > SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            dist/macos/ConsoleCrypt-*-macos-universal.dmg
            dist/macos/SHA256SUMS-macos.txt
            dist/macos/ConsoleCrypt.version

  windows:
    needs: validate
    runs-on: [self-hosted, Windows, X64, consolecrypt, client]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false
      - name: Register this release workspace
        run: '& client/scripts/cleanup-ci-workspace.ps1 -ClaimWorkspace'
      - name: Check and package Windows
        env:
          CC_KUBE_WSL_LIVE: '1'
        run: |
          & client/scripts/ci-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            dist/windows/*-setup.exe
            dist/windows/ConsoleCrypt-windows.zip
            dist/windows/*.sha256
            dist/windows/ConsoleCrypt.version

  linux:
    needs: validate
    runs-on: cc-linux-k3s
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reserve build number
        run: python3 client/scripts/github-build-number.py linux
      - name: Kubernetes, Flux and Helm acceptance in an isolated cluster
        run: python3 client/scripts/ci-kubernetes-linux.py --workspace "$GITHUB_WORKSPACE"
      - name: Build and check native Linux DEB and RPM
        run: bash client/scripts/ci-linux.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            dist/linux/*.deb
            dist/linux/*.rpm
            dist/linux/*.SHA256SUMS
            dist/linux/*.json
            dist/linux/acceptance/linux-ffi-integration.json
            dist/linux/acceptance/kubernetes-acceptance.json
            dist/linux/acceptance/kubernetes-acceptance.log
            dist/linux/ConsoleCrypt.version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: linux-kubernetes-diagnostics
          if-no-files-found: warn
          retention-days: 30
          path: |
            dist/linux/acceptance/kubernetes-acceptance.json
            dist/linux/acceptance/kubernetes-acceptance.log
      - name: Stop owned Kubernetes test containers and retain diagnostics
        if: always()
        run: python3 client/scripts/ci-kubernetes-linux.py --workspace "$GITHUB_WORKSPACE" --stop
      - name: Stop this job's Linux container and retain scratch
        if: always()
        run: python3 client/scripts/cleanup-linux-job.py --workspace "$GITHUB_WORKSPACE"

  android:
    needs: validate
    runs-on: [self-hosted, macOS, ARM64, consolecrypt, client]
    timeout-minutes: 180
    env:
      ANDROID_HOME: ${{ vars.ANDROID_HOME }}
      JAVA_HOME: ${{ vars.JAVA_HOME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false
      - name: Register this release workspace
        run: python3 client/scripts/cleanup-ci-workspace.py --workspace "$GITHUB_WORKSPACE" --claim-workspace
      - name: Native toolchain and version
        run: |
          source client/scripts/ci-macos-tools.sh
          python3 client/scripts/github-build-number.py android
      - name: Build APK with the existing runner signer
        run: bash client/scripts/build-android.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            dist/android/ConsoleCrypt-android-arm64.apk
            dist/android/ConsoleCrypt-android-arm64.apk.sha256
            dist/android/ConsoleCrypt.version

  # iOS Simulator: build and launch in an isolated, throwaway Simulator. The
  # preview is kept as a workflow artifact only; releases do not publish it
  # (prepare-github-release.py) and a failure here does not block them.
  ios:
    needs: validate
    runs-on: [self-hosted, macOS, ARM64, consolecrypt, client]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false
      - name: Register this release workspace
        run: python3 client/scripts/cleanup-ci-workspace.py --workspace "$GITHUB_WORKSPACE" --claim-workspace
      - name: Native toolchain and version
        run: |
          source client/scripts/ci-macos-tools.sh --xcode
          python3 client/scripts/github-build-number.py ios
      - name: Build and launch an isolated iOS Simulator preview
        run: bash client/scripts/ci-ios.sh --build-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-preview
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            dist/ios/ConsoleCrypt-*-ios-simulator-universal.zip
            dist/ios/ConsoleCrypt-*-ios-simulator-universal.zip.sha256
            dist/ios/ConsoleCrypt-simulator-universal.version

  publish:
    outputs:
      published: ${{ steps.release.outputs.published }}
    needs: [validate, macos, windows, linux, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts
      - name: Assemble versioned installers and checksums
        run: python3 client/scripts/prepare-github-release.py --artifacts release-artifacts --output release-out --version "$RELEASE_VERSION"
      - name: Publish complete release without replacing an existing version
        id: release
        run: |
          # Create a draft first; partial uploads never appear as latest.
          # A rerun must use a new tag if this release already exists.
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "ConsoleCrypt $RELEASE_VERSION" \
            --notes-file "docs/public/RELEASE_${RELEASE_VERSION//./_}.md" \
            release-out/*
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Request signed update metadata from trusted main
        run: gh workflow run update-feeds.yml --ref main

  # Post the published release to the Telegram channel. Optional: skipped
  # without the secrets, and a failure never marks the release as failed.
  announce:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_PROXY: ${{ secrets.TELEGRAM_PROXY }}
      # DOC-04: each channel is enabled by the owner setting its secret or variable.
      TELEGRAM_PERSONAL_CHAT_ID: ${{ vars.TELEGRAM_PERSONAL_CHAT_ID }}
      EVSIKOVNET_TOKEN: ${{ secrets.EVSIKOVNET_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Announce the release in Telegram
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: python3 client/scripts/announce-telegram.py --tag "$GITHUB_REF_NAME"
      - name: Announce the release in the personal channel (@evsikovlife)
        if: always() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_PERSONAL_CHAT_ID != ''
        run: TELEGRAM_CHAT_ID="$TELEGRAM_PERSONAL_CHAT_ID" python3 client/scripts/announce-telegram.py --tag "$GITHUB_REF_NAME"
      - name: Publish the release on evsikov.net
        if: always() && env.EVSIKOVNET_TOKEN != ''
        run: python3 client/scripts/announce-evsikovnet.py --tag "$GITHUB_REF_NAME"

  # No checkout here: validate the immutable owner/HEAD of the released build.
  # The workflow concurrency lock remains held until this job finishes.
  # The persistent Windows runner keeps its build cache after publication:
  # incremental native builds take minutes instead of a full rebuild.
  cleanup_macos:
    needs: publish
    if: always() && needs.publish.outputs.published == 'true'
    runs-on: [self-hosted, macOS, ARM64, consolecrypt, client]
    timeout-minutes: 30
    env:
      CC_RELEASE_PUBLISHED: ${{ needs.publish.outputs.published }}
    steps:
      - name: Clean the published release workspace
        run: python3 client/scripts/cleanup-ci-workspace.py --workspace "$GITHUB_WORKSPACE" --after-publication
