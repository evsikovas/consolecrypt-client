name: Agent source checks

on:
  pull_request:
    paths: ['agent/**', '.github/workflows/agent.yml', 'client/scripts/*export_source*', 'client/scripts/export-source.py']
  push:
    branches: [main, ci/agent-arm64-observe-r17, ci/platform-final-r17, ci/agent-arm64-capability-r17]
    paths: ['agent/**', '.github/workflows/agent.yml', 'client/scripts/*export_source*', 'client/scripts/export-source.py']
  workflow_dispatch:
    inputs:
      native_arm_mode:
        description: Explicit disposable native ARM acceptance; source checks remain the default
        type: choice
        default: disabled
        options: [disabled, observe, installed]
      reviewed_runtime_pin_sha256:
        description: Independently reviewed SHA256 of tracked .github/fixtures/agent-installed/runtime-pin.json; installed mode only
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: agent-source-${{ github.ref }}-${{ inputs.native_arm_mode || 'disabled' }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/ci/platform-final-r17') && (github.event_name != 'workflow_dispatch' || inputs.native_arm_mode != 'installed') }}

jobs:
  source-python:
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.native_arm_mode != 'observe') &&
      (github.event_name != 'push' || github.ref != 'refs/heads/ci/agent-arm64-observe-r17') &&
      (github.event_name != 'push' || github.ref != 'refs/heads/ci/agent-arm64-capability-r17')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check source, vendor bytes and export boundaries
        run: |
          python3 -I -B agent/scripts/check_source.py
          python3 -B -m unittest discover -s agent/scripts/tests -p 'test_*.py' -v
          python3 -B -m unittest discover -s client/scripts -p 'test_export_source.py' -v
      - name: Test runtime without enabling the Agent
        env:
          PYTHONPATH: ${{ github.workspace }}/agent/third_party/websockets/websockets-17.4-py3-none-any.whl
        run: |
          python3 -B -m unittest discover -s agent/runtime/tests -p 'test_*.py' -v
          python3 -B -m unittest discover -s agent/integration/tests -p 'test_*.py' -v

  identity:
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.native_arm_mode != 'observe') &&
      (github.event_name != 'push' || github.ref != 'refs/heads/ci/agent-arm64-observe-r17') &&
      (github.event_name != 'push' || github.ref != 'refs/heads/ci/agent-arm64-capability-r17')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the locked Agent identity crate
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cc-agent-identity-target
        run: cargo test --locked --manifest-path agent/identity/Cargo.toml --all-targets

  native-arm-capability-observe:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci/agent-arm64-capability-r17'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Compare baseline and one owned named AppArmor userns profile
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '6e289922e571a27a725eb95653a39ca6af1319f09f53f572a0572195706c8404  .github/fixtures/agent-installed/arm64_capability_observe.py' | sha256sum --check --strict
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT \
            /usr/bin/python3.12 -I -B .github/fixtures/agent-installed/arm64_capability_observe.py \
            --execute-disposable-arm-apparmor-ab-only | tee "$RUNNER_TEMP/cc-arm64-capability-result.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-arm64-capability-observation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/cc-arm64-capability-result.json

  native-arm-python-observe:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.native_arm_mode == 'observe') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/ci/agent-arm64-observe-r17')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Observe the fixed ARM interpreter without approving a pin
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'a9679355bbd0da789129e649f14084c6942d226d16ea46d69c9a7cbd5aeb7cdd  .github/fixtures/agent-installed/arm64_python_observe.py' | sha256sum --check --strict
          /usr/bin/python3.12 -I -B .github/fixtures/agent-installed/arm64_python_observe.py \
            --observe-only --output "$RUNNER_TEMP/cc-arm64-python-candidate.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-arm64-python-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/cc-arm64-python-candidate.json

  native-arm-installed:
    if: >-
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/ci/platform-final-r17') ||
       (github.event_name == 'workflow_dispatch' && inputs.native_arm_mode == 'installed')) &&
      needs.source-python.result == 'success' && needs.identity.result == 'success'
    needs: [source-python, identity]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    concurrency:
      group: agent-native-arm-installed
      cancel-in-progress: false
    env:
      CC_FIXTURES: ${{ github.workspace }}/.github/fixtures/agent-installed
      CC_REVIEWED_PIN_SHA256: ${{ github.event_name == 'push' && github.ref == 'refs/heads/ci/platform-final-r17' && 'f9bf701065f5f04556a97557dcbbf402a3d775b57f99c5d18ba5a7162b4565d6' || inputs.reviewed_runtime_pin_sha256 }}
      CC_SOURCE_COMMIT: ${{ github.sha }}
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require reviewed sources and the independently selected runtime pin
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3.12 -I -B - <<'PY'
          import hashlib,json,os,re,subprocess,sys
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE']);fixtures=root/'.github/fixtures/agent-installed'
          expected={'arm64_build.py': '023e88c6a8d7eebdbce9a6e5045a83ef5e4985450292804e028c6b26a943ecd4', 'arm64_host.py': '65b17f5ea0e68d66f6053d6647e4c0f24bfc8eb1092d15f9ffc70b97a54c59ef', 'seal_ram_bundle.arm64.py': '9e938012bc7b24340c8293efdd5ddbde32629bdb62e94efe3e0fa2d90a9db3f7', 'arm64_python_observe.py': 'a9679355bbd0da789129e649f14084c6942d226d16ea46d69c9a7cbd5aeb7cdd', 'synthetic_node_authority.arm64.rs': '7f403db17f36d26ad4c084b2dda0e794f7b7b6b81cb010f2de500241c766da02', 'synthetic_exporter_authority.rs': '755e16a4355a8606f653caa2fbfb99a30e28727e8d3770579239cdf91e597601', 'synthetic_release_fixture.rs': '9a1885366921b4ef18f291fa4729a39f22af1b34fb676bf1a2dcdb6c87763f63', 'guest_lifecycle.py': '302f88020c99f6ab25354704d9ed81ae33ab9430cd6782a357fb212ff72ca141', 'sqlite_fixture_flow.py': '1d9e95444dbfcde22af7d295844de5c80f43b5d237c248da36dc27083d762786', 'current_release_inputs.py': 'c062207ffb197eacc0b5cdd083b91b686d6aa227d42f1ba15bad5cc915b9bdc5', 'runtime-pin.provenance.json': '9ed672cc719b13747760ca5580513ac3c59f134eb14d419538a7b77d0e3f1b8d', 'ARM64_ANSIBLE_WHEELS.json': '34d44603cda4e8ccf3ee29a21b24241f834a0f694a46ddb0664401ee89c8ceaf', 'requirements-linux-aarch64-py312-installed.lock': 'e96c9c53e2ed70e65f6932978dc2740c3b8d9dfe17b98f233149d6a70382c42d'}
          assert sys.platform=='linux' and os.uname().machine=='aarch64'
          assert os.getuid()==os.geteuid()!=0
          assert os.environ['GITHUB_ACTIONS']=='true' and os.environ['RUNNER_ARCH']=='ARM64'
          assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
          # Check exact reviewed bytes before importing any fixture owner.
          for name,wanted in expected.items():
              path=fixtures/name
              assert path.resolve(strict=True)==path and path.is_file() and path.stat().st_nlink==1
              assert 0<path.stat().st_size<=262144 and hashlib.sha256(path.read_bytes()).hexdigest()==wanted
              subprocess.run(['git','ls-files','--error-unmatch','--',str(path.relative_to(root))],cwd=root,check=True,stdout=subprocess.DEVNULL)
          sys.path[:0]=[str(fixtures),str(root/'agent/delivery')]
          from arm64_host import read,digest
          from arm64_build import COLLECTOR_MATERIALS_SHA256
          assert digest(read(root/'agent/delivery/collector_materials.py',131072))==COLLECTOR_MATERIALS_SHA256
          from prototype_package import public_runtime_pin
          wanted=os.environ['CC_REVIEWED_PIN_SHA256']
          assert re.fullmatch('[0-9a-f]{64}',wanted) and wanted!='0'*64
          pin_path=fixtures/'runtime-pin.json'
          subprocess.run(['git','ls-files','--error-unmatch','--',str(pin_path.relative_to(root))],cwd=root,check=True,stdout=subprocess.DEVNULL)
          raw=public_runtime_pin(pin_path);assert digest(raw)==wanted
          pin=json.loads(raw);assert pin['pythonExecutable']=='/usr/bin/python3.12'
          python=read(Path(pin['pythonExecutable']),33554432)
          assert digest(python)==pin['pythonSha256'] and python[:7]==b'\x7fELF\x02\x01\x01'
          assert int.from_bytes(python[18:20],'little')==183
          assert subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()==os.environ['CC_SOURCE_COMMIT']
          # Candidate observation output is never consumed or promoted here.
          PY
          systemctl --user show-environment >/dev/null
      - name: Prepare the exact native controller and locked Rust dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3.12 -I -B -m venv --copies "$RUNNER_TEMP/cc-arm64-ansible"
          "$RUNNER_TEMP/cc-arm64-ansible/bin/python" -I -B -m pip --isolated install \
            --no-index --only-binary=:all: --require-hashes --no-cache-dir \
            --report "$RUNNER_TEMP/cc-arm64-ansible-install.json" \
            -r "$CC_FIXTURES/requirements-linux-aarch64-py312-installed.lock"
          systemd-run --user --scope --quiet -p MemoryMax=3221225472 -p MemorySwapMax=0 -p CPUQuota=200% -p TasksMax=256 \
            rustup toolchain install 1.98.1 --profile minimal
          systemd-run --user --scope --quiet -p MemoryMax=3221225472 -p MemorySwapMax=0 -p CPUQuota=200% -p TasksMax=256 \
            cargo fetch --locked --manifest-path agent/identity/Cargo.toml
      - name: Produce the genuine native hard-budget disk collector
        timeout-minutes: 22
        shell: bash
        run: |
          set -euo pipefail
          systemd-run --user --scope --quiet -p MemoryMax=3221225472 -p MemorySwapMax=0 -p CPUQuota=200% -p TasksMax=256 \
            /usr/bin/python3.12 -I -B agent/delivery/prometheus_build.py \
            --target aarch64-unknown-linux-gnu --output "$RUNNER_TEMP/cc-arm64-prometheus"
      - name: Capture actual ARM collector supply and official Go materials
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          systemd-run --user --scope --quiet -p MemoryMax=3221225472 -p MemorySwapMax=0 -p CPUQuota=200% -p TasksMax=256 \
            /usr/bin/python3.12 -I -B agent/collector/supply.py \
            --platform linux-arm64 --destination "$RUNNER_TEMP/cc-arm64-vmagent"
          systemd-run --user --scope --quiet -p MemoryMax=3221225472 -p MemorySwapMax=0 -p CPUQuota=200% -p TasksMax=256 \
            /usr/bin/python3.12 -B agent/delivery/collector_materials.py \
            --platform linux-arm64 --binary "$RUNNER_TEMP/cc-arm64-vmagent/vmagent-prod" \
            --go "$RUNNER_TEMP/cc-arm64-prometheus/cache/go/bin/go" \
            --output "$RUNNER_TEMP/cc-arm64-materials"
      - name: Build and seal the same-owner native fixture packet
        timeout-minutes: 26
        shell: bash
        run: |
          set -euo pipefail
          systemd-run --user --scope --quiet -p MemoryMax=3221225472 -p MemorySwapMax=0 -p CPUQuota=200% -p TasksMax=256 \
            /usr/bin/python3.12 -I -B "$CC_FIXTURES/arm64_build.py" \
            --execute-native-arm-build --agent "$GITHUB_WORKSPACE/agent" \
            --source-commit "$CC_SOURCE_COMMIT" --output "$RUNNER_TEMP/cc-arm64-packet" \
            --runtime-pin "$CC_FIXTURES/runtime-pin.json" --runtime-pin-sha256 "$CC_REVIEWED_PIN_SHA256" \
            --disk-input "$RUNNER_TEMP/cc-arm64-prometheus/input.json" \
            --vmagent-binary "$RUNNER_TEMP/cc-arm64-vmagent/vmagent-prod" \
            --collector-materials "$RUNNER_TEMP/cc-arm64-materials/materials.json" \
            --actor-source "$CC_FIXTURES/synthetic_node_authority.arm64.rs" \
            --exporter-source "$CC_FIXTURES/synthetic_exporter_authority.rs" \
            --synthetic-signer-source "$CC_FIXTURES/synthetic_release_fixture.rs"
      - name: Execute the existing installation and cleanup assertions on this disposable host
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          packet_sha=$(sha256sum "$RUNNER_TEMP/cc-arm64-packet/agent-ram-canonical/fixture-packages.json")
          packet_sha=${packet_sha%% *}
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ARCH,RUNNER_ENVIRONMENT \
            /usr/bin/python3.12 -I -B "$CC_FIXTURES/arm64_host.py" \
            --execute-disposable-arm-host --agent "$GITHUB_WORKSPACE/agent" \
            --packet "$RUNNER_TEMP/cc-arm64-packet/agent-ram-canonical" --packet-sha256 "$packet_sha" \
            --runtime-pin "$CC_FIXTURES/runtime-pin.json" --runtime-pin-sha256 "$CC_REVIEWED_PIN_SHA256" \
            --primitives "$CC_FIXTURES/sqlite_fixture_flow.py" \
            --lifecycle-sha256 302f88020c99f6ab25354704d9ed81ae33ab9430cd6782a357fb212ff72ca141 \
            --primitives-sha256 1d9e95444dbfcde22af7d295844de5c80f43b5d237c248da36dc27083d762786 \
            --ansible-python "$RUNNER_TEMP/cc-arm64-ansible/bin/python" \
            --ansible-wheel-catalog "$CC_FIXTURES/ARM64_ANSIBLE_WHEELS.json" \
            --ansible-lock "$CC_FIXTURES/requirements-linux-aarch64-py312-installed.lock" \
            --ansible-install-report "$RUNNER_TEMP/cc-arm64-ansible-install.json" \
            --output "$RUNNER_TEMP/cc-arm64-installed-result"
      - name: Collect only the bounded public installation result and role logs
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/bin/python3.12 -I -B - "$RUNNER_TEMP" <<'PY'
          import os,stat,sys
          from pathlib import Path
          temp=Path(sys.argv[1]);source=temp/'cc-arm64-installed-result'
          target=temp/'cc-arm64-public-result';target.mkdir(mode=0o755)
          names=('RESULT.json','group.log','user.log',*(f'{i:02d}-role.log' for i in range(1,8)),*(f'cleanup-{i}.log' for i in range(3)))
          producer=temp/'cc-arm64-prometheus/artifacts'
          producer_names=('compiler-version.log','module-download-result.json',
              'module-metadata-result.json','module-metadata-stderr.log','module-metadata.log',
              'module-metadata-offline-result.json','module-metadata-offline-stderr.log','module-metadata-offline.log',
              'module-graph-result.json','module-graph-stderr.log','module-graph.log')
          inputs=[(source/name,name)for name in names]
          inputs.extend((producer/name,'producer-'+name)for name in producer_names)
          inputs.append((temp/'cc-arm64-packet/COMPILER_RESULT.json','compiler-result.json'))
          inputs.append((temp/'cc-agent-notice-inventory-budget.json','notice-inventory-budget.json'))
          total=0
          for path,name in inputs:
              if not path.exists():continue
              assert path.resolve(strict=True)==path
              with path.open('rb') as stream:
                  before=os.fstat(stream.fileno())
                  assert stat.S_ISREG(before.st_mode) and before.st_nlink==1 and before.st_size<=1048576
                  raw=stream.read(1048577);after=os.fstat(stream.fileno())
                  stamp=lambda m:(m.st_dev,m.st_ino,m.st_size,m.st_mtime_ns,m.st_ctime_ns)
                  assert len(raw)==before.st_size and stamp(before)==stamp(after)==stamp(path.lstat())
              total+=len(raw);assert total<=16*1048576
              with (target/name).open('xb') as stream:stream.write(raw)
              (target/name).chmod(0o644)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-arm64-installed-public-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/cc-arm64-packet/BUILD_RESULT.json
            ${{ runner.temp }}/cc-arm64-public-result/RESULT.json
            ${{ runner.temp }}/cc-arm64-public-result/group.log
            ${{ runner.temp }}/cc-arm64-public-result/user.log
            ${{ runner.temp }}/cc-arm64-public-result/0?-role.log
            ${{ runner.temp }}/cc-arm64-public-result/cleanup-?.log
            ${{ runner.temp }}/cc-arm64-public-result/producer-compiler-version.log
            ${{ runner.temp }}/cc-arm64-public-result/producer-module-download-result.json
            ${{ runner.temp }}/cc-arm64-public-result/producer-module-metadata-result.json
            ${{ runner.temp }}/cc-arm64-public-result/producer-module-metadata-stderr.log
            ${{ runner.temp }}/cc-arm64-public-result/producer-module-metadata.log
            ${{ runner.temp }}/cc-arm64-public-result/producer-module-metadata-offline-result.json
            ${{ runner.temp }}/cc-arm64-public-result/producer-module-metadata-offline-stderr.log
            ${{ runner.temp }}/cc-arm64-public-result/producer-module-metadata-offline.log
            ${{ runner.temp }}/cc-arm64-public-result/producer-module-graph-result.json
            ${{ runner.temp }}/cc-arm64-public-result/producer-module-graph-stderr.log
            ${{ runner.temp }}/cc-arm64-public-result/producer-module-graph.log
            ${{ runner.temp }}/cc-arm64-public-result/compiler-result.json
            ${{ runner.temp }}/cc-arm64-public-result/notice-inventory-budget.json

# Installed jobs require explicit manual selection or the exact reviewed test branch push.
# Observe candidate job and its non-approval flags remain unchanged.
# Fixture authority is test-only; no production environment, secrets, push,
# release, deployment, persistent runner or automatic candidate-pin adoption.
