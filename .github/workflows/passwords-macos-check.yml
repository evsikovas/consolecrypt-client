name: Password manager on local macOS

on:
  push:
    branches: ['ci/passwords-macos-check']

permissions:
  contents: read

jobs:
  macos:
    if: github.repository == 'evsikovas/consolecrypt-client'
    runs-on: [self-hosted, macOS, ARM64, consolecrypt, client]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Flutter toolchain on the local Mac
        run: |
          source client/scripts/ci-macos-tools.sh
          sw_vers
          uname -m
      - name: Test KDBX, palette, panes and real loopback Vault and OpenBao
        shell: bash
        run: |
          set -euo pipefail
          tools=$(mktemp -d "${RUNNER_TEMP:?}/consolecrypt-password-check.XXXXXX")
          trap 'rm -rf -- "$tools"' EXIT
          curl -fsSL --retry 2 -o "$tools/vault.zip" https://releases.hashicorp.com/vault/1.21.4/vault_1.21.4_darwin_arm64.zip
          curl -fsSL --retry 2 -o "$tools/bao.tgz" https://github.com/openbao/openbao/releases/download/v2.7.2/openbao_2.7.2_darwin_arm64.tar.gz
          (
            cd "$tools"
            printf '%s\n' \
              'c79012c1c8aedd682c68b5d9c89149030611c82da57f45383aef004b39a640d2  vault.zip' \
              '2b4fc131910f4b075b2e1c9a9de67c461489491a8f03fbdc73387294d67d9547  bao.tgz' | shasum -a 256 --check
          )
          mkdir "$tools/bao"
          unzip -q "$tools/vault.zip" -d "$tools"
          tar -xzf "$tools/bao.tgz" -C "$tools/bao"
          export CC_TEST_VAULT="$tools/vault"
          export CC_TEST_OPENBAO=$(find "$tools/bao" -type f -name bao -print -quit)
          test -x "$CC_TEST_VAULT" && test -x "$CC_TEST_OPENBAO"
          cd client/flutter
          flutter pub get --enforce-lockfile
          flutter test --no-pub --reporter expanded --concurrency=3 \
            test/unit/external_vault_test.dart test/unit/kdbx_exchange_test.dart \
            test/unit/kdbx_client_test.dart test/unit/kdbx_webdav_test.dart \
            test/integration/external_vault_live_test.dart \
            test/widget/command_palette_test.dart test/widget/kdbx_dialog_test.dart \
            test/widget/terminal_tab_placement_test.dart test/widget/workspace_tools_test.dart \
            test/widget/appearance_test.dart
