name: Agent signed release candidate

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Reviewed monotonic release sequence above protected environment floor
        required: true
        type: string
      display_version:
        description: Reviewed package display version (major.minor.patch)
        required: true
        type: string
      supervisor_runtime_pins:
        description: 'Reviewed public JSON: linux-x86_64/linux-aarch64 each {path,sha256}; fixed tracked agent/delivery/runtime-pins/<platform>.json, Python3.11/3.12 only'
        required: true
        type: string
      include_disk_collector:
        description: Include a genuinely prepared normal hard-budget Prometheus input; missing input fails before build
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: agent-release-candidate
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'evsikovas/consolecrypt-client' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: agent-release-signing
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            collector: linux-amd64
            release: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            collector: linux-arm64
            release: linux-aarch64
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: ${{ runner.temp }}/cc-agent-release-target
      CC_RELEASE_WORK: ${{ runner.temp }}/cc-agent-release-${{ matrix.target }}
      CC_RELEASE_VERSION: ${{ inputs.release_version }}
      CC_RELEASE_DISPLAY_VERSION: ${{ inputs.display_version }}
      CC_RELEASE_INCLUDE_DISK: ${{ inputs.include_disk_collector }}
      CC_REVIEWED_RUNTIME_PINS_JSON: ${{ inputs.supervisor_runtime_pins }}
      CC_RELEASE_PLATFORM: ${{ matrix.release }}
      CC_SUPERVISOR_RUNTIME_PIN: ${{ github.workspace }}/agent/delivery/runtime-pins/${{ matrix.release }}.json
      CC_NORMAL_DISK_INPUT: ${{ runner.temp }}/cc-agent-normal-prometheus-${{ matrix.target }}/input.json
      CC_AGENT_RELEASE_APPROVED_FLOOR: ${{ vars.CC_AGENT_RELEASE_APPROVED_FLOOR }}
      CC_AGENT_RELEASE_EXPECTED_PUBLIC_KEY: ${{ vars.CC_AGENT_RELEASE_EXPECTED_PUBLIC_KEY }}
    steps:
      - name: Require the dedicated release secret and independently reviewed public pin
        env:
          CC_AGENT_RELEASE_ED25519_SEED_HEX: ${{ secrets.CC_AGENT_RELEASE_ED25519_SEED_HEX }}
        shell: bash
        run: |
          test -n "$CC_AGENT_RELEASE_ED25519_SEED_HEX" || { echo 'Dedicated Agent release secret is missing; no fallback is permitted.' >&2; exit 1; }
          test -n "$CC_AGENT_RELEASE_EXPECTED_PUBLIC_KEY" || { echo 'Reviewed Agent release public key is missing.' >&2; exit 1; }
          test -n "$CC_AGENT_RELEASE_APPROVED_FLOOR" || { echo 'Reviewed monotonic release floor is missing.' >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Validate the independently reviewed platform runtime pin
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import hashlib,json,os,re,subprocess,sys
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])
          sys.path.insert(0,str(root/'agent/delivery'))
          from prototype_package import public_runtime_pin
          def unique(rows):
              value={}
              for key,item in rows:
                  if key in value:raise ValueError('duplicate reviewed runtime pin field')
                  value[key]=item
              return value
          raw=os.environ['CC_REVIEWED_RUNTIME_PINS_JSON']
          if len(raw)>4096:raise ValueError('reviewed runtime selection exceeds bound')
          rows=json.loads(raw,object_pairs_hook=unique)
          if type(rows)is not dict or set(rows)!={'linux-x86_64','linux-aarch64'}:
              raise ValueError('both fixed platform runtime reviews required')
          for platform,row in rows.items():
              if (type(row)is not dict or set(row)!={'path','sha256'}
                      or row['path']!='agent/delivery/runtime-pins/'+platform+'.json'
                      or type(row['sha256'])is not str or not re.fullmatch('[0-9a-f]{64}',row['sha256'])
                      or row['sha256']=='0'*64):
                  raise ValueError('closed tracked runtime path and reviewed SHA required')
          platform=os.environ['CC_RELEASE_PLATFORM'];row=rows[platform]
          subprocess.run(['git','ls-files','--error-unmatch','--',row['path']],cwd=root,check=True,stdout=subprocess.DEVNULL)
          pin=root/row['path']
          if str(pin)!=os.environ['CC_SUPERVISOR_RUNTIME_PIN']:
              raise ValueError('selected platform runtime path changed')
          # The existing held-file reader validates exact schema +3.11/3.12.
          # Never read this runner's interpreter or derive a trust fingerprint.
          if hashlib.sha256(public_runtime_pin(pin)).hexdigest()!=row['sha256']:
              raise ValueError('independently reviewed runtime pin SHA mismatch')
          PY
      - name: Validate the explicit normal disk candidate choice
        shell: bash
        run: |
          case "$CC_RELEASE_INCLUDE_DISK" in
            false|true) ;;
            *) echo 'Explicit boolean disk candidate choice required.' >&2; exit 1 ;;
          esac
      - name: Build the fixed normal hard-budget collector and full materials
        if: ${{ inputs.include_disk_collector }}
        timeout-minutes: 22
        shell: bash
        run: |
          # Native fixed Go1.27.4 compiler row on each native Linux runner;
          # no test ELF, ordinary upstream ELF, emulation or desired version.
          python3 -B agent/delivery/prometheus_build.py --target "${{ matrix.target }}" --output "${CC_NORMAL_DISK_INPUT%/input.json}"
          test -s "$CC_NORMAL_DISK_INPUT" && test ! -L "$CC_NORMAL_DISK_INPUT" || { echo 'Genuine normal disk producer did not publish its SAME-run input.' >&2; exit 1; }
      # Native jobs execute ordinary Rust tests on the selected CPU. This is
      # candidate construction, not systemd/seccomp/pidfd installed acceptance.
      # ARM full notices remain DENY until its exact binary/buildinfo source
      # record is independently observed and reviewed; no AMD64 reuse.
      - name: Build the normal native Linux Agent and separate fixed-purpose signer
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          export RUSTUP_TOOLCHAIN=1.98.1
          python3 -B -m unittest discover -s agent/delivery/tests -p 'test_release*.py' -v
          python3 -B -m unittest discover -s agent/delivery/tests -p test_package_source_closure.py -v
          python3 -B -m unittest discover -s agent/delivery/tests -p test_collector_materials.py -v
          # Notice capture walks the entire exact lock, including other-target
          # components. Fetch those pinned archives too; compile target stays fixed.
          cargo fetch --locked --manifest-path agent/identity/Cargo.toml
          python3 -B agent/delivery/release_pipeline.py before --target "${{ matrix.target }}" --work "$CC_RELEASE_WORK"
          cargo test --locked --offline --manifest-path agent/identity/Cargo.toml --target "${{ matrix.target }}" --bins
          cargo build --locked --offline --release --manifest-path agent/identity/Cargo.toml --target "${{ matrix.target }}" --bin cc-agent-identity --bin cc-agent-release-sign --message-format=json > "$CC_RELEASE_WORK/cargo-build.jsonl"
          python3 -B agent/collector/supply.py --platform "${{ matrix.collector }}" --destination "$CC_RELEASE_WORK/collector-supply"
          command -v go >/dev/null || { echo 'Official local Go tool is required for actual collector materials.' >&2; exit 1; }
          python3 -B agent/delivery/collector_materials.py --binary "$CC_RELEASE_WORK/collector-supply/vmagent-prod" --output "$CC_RELEASE_WORK/collector-materials" --platform "${{ matrix.collector }}" --go "$(command -v go)"
          disk_args=()
          if [ "$CC_RELEASE_INCLUDE_DISK" = true ]; then
            disk_args=(--disk-input "$CC_NORMAL_DISK_INPUT")
          fi
          # Existing disk_input + notice component validate actual bytes,
          # original build/source/buildinfo/material hashes and existing caps
          # before signing. Prepared JSON alone never establishes acceptance.
          python3 -B agent/delivery/release_pipeline.py package --work "$CC_RELEASE_WORK" --vmagent-binary "$CC_RELEASE_WORK/collector-supply/vmagent-prod" --collector-materials "$CC_RELEASE_WORK/collector-materials/materials.json" --supervisor-runtime-pin "$CC_SUPERVISOR_RUNTIME_PIN" "${disk_args[@]}"
      - name: Retain exact corresponding public Agent and dependency source before signing
        shell: bash
        run: python3 -B agent/delivery/release_dependency_sources.py archive --work "$CC_RELEASE_WORK"
      - name: Sign only the typed release manifest with the dedicated Agent release key
        env:
          CC_AGENT_RELEASE_ED25519_SEED_HEX: ${{ secrets.CC_AGENT_RELEASE_ED25519_SEED_HEX }}
        shell: bash
        run: |
          "$CC_RELEASE_WORK/cc-agent-release-sign" --manifest "$CC_RELEASE_WORK/unsigned-release.json" --output-dir "$CC_RELEASE_WORK/signed" --expected-public-key "$CC_AGENT_RELEASE_EXPECTED_PUBLIC_KEY" --seed-env CC_AGENT_RELEASE_ED25519_SEED_HEX
          python3 -B agent/delivery/release_pipeline.py self-verify --work "$CC_RELEASE_WORK"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-release-candidate-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ env.CC_RELEASE_WORK }}/candidate.zip
            ${{ env.CC_RELEASE_WORK }}/signed/*.json
            ${{ env.CC_RELEASE_WORK }}/build-public.json
            ${{ env.CC_RELEASE_WORK }}/package-public.json
            ${{ env.CC_RELEASE_WORK }}/collector-materials/buildinfo.json
            ${{ env.CC_RELEASE_WORK }}/collector-materials/materials.json
            ${{ env.CC_RELEASE_WORK }}/collector-materials/receipt.json
            ${{ env.CC_RELEASE_WORK }}/verified-public.json
            ${{ env.CC_RELEASE_WORK }}/trust.example.json
            ${{ env.CC_RELEASE_WORK }}/source.tar
            ${{ env.CC_RELEASE_WORK }}/source-public.json
            ${{ env.CC_RELEASE_WORK }}/cc-agent-identity
            ${{ runner.temp }}/cc-agent-normal-prometheus-${{ matrix.target }}/input.json
            ${{ runner.temp }}/cc-agent-normal-prometheus-${{ matrix.target }}/receipt.json
            ${{ runner.temp }}/cc-agent-normal-prometheus-${{ matrix.target }}/artifacts/build-report.json
            ${{ runner.temp }}/cc-agent-normal-prometheus-${{ matrix.target }}/artifacts/source-map.json
            ${{ runner.temp }}/cc-agent-normal-prometheus-${{ matrix.target }}/artifacts/materials.json
            ${{ runner.temp }}/cc-agent-normal-prometheus-${{ matrix.target }}/artifacts/buildinfo.log
          # Deliberately excludes the signer executable, private input/env and
          # Cargo caches. No GitHub release, push, deployment or automatic trust.

