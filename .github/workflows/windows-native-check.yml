name: Native checks by diagnostic tag

# Diagnostic tags exercise native tests without producing or publishing clients.
# Stable installers continue to be built only by client.yml release tags.
on:
  push:
    tags: ['check-windows-*', 'check-kubernetes-*']

permissions:
  contents: read

concurrency:
  group: consolecrypt-client-packages
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'evsikovas/consolecrypt-client'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check diagnostic tag and main ancestry
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          if not re.fullmatch(r'refs/tags/check-(?:windows|kubernetes)-[0-9]+\.[0-9]+\.[0-9]+-[1-9][0-9]*', os.environ['GITHUB_REF']):
              raise SystemExit('Invalid native diagnostic tag')
          subprocess.run(['git', 'merge-base', '--is-ancestor', 'HEAD', 'origin/main'], check=True)
          PY
      - name: Test isolated cluster ownership and fixtures
        run: python3 -m unittest discover -s client/scripts/tests -p test_kubernetes_ci.py -v

  windows:
    needs: validate
    runs-on: [self-hosted, Windows, X64, consolecrypt, client]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false
      - name: Register diagnostic workspace without cleanup
        run: '& client/scripts/cleanup-ci-workspace.ps1 -ClaimWorkspace'
      - name: Native terminal and Kubernetes regressions
        env:
          CC_KUBE_WSL_LIVE: '1'
        run: |
          & client/scripts/ci-windows.ps1 -NativeOnly
          if ($LASTEXITCODE -ne 0) { throw 'Windows native checks failed' }

  macos:
    needs: validate
    if: startsWith(github.ref_name, 'check-kubernetes-')
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Xcode and Flutter
        run: source client/scripts/ci-macos-tools.sh --xcode
      - name: Native Kubernetes and Flutter regressions
        run: |
          cargo test --manifest-path client/rust/Cargo.toml --locked -p cc-k8s-core --all-targets
          cargo test --manifest-path client/rust/Cargo.toml --locked -p cc-app-core kubernetes --lib
          cd client/flutter
          flutter pub get
          flutter analyze
          flutter test --dart-define=CC_KUBERNETES=true

  linux-kubernetes:
    needs: validate
    if: startsWith(github.ref_name, 'check-kubernetes-')
    runs-on: cc-linux-k3s
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Kubernetes, Flux and Helm acceptance in an isolated cluster
        run: python3 client/scripts/ci-kubernetes-linux.py --workspace "$GITHUB_WORKSPACE"
      - name: Stop owned test containers and retain diagnostics
        if: always()
        run: python3 client/scripts/ci-kubernetes-linux.py --workspace "$GITHUB_WORKSPACE" --stop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-kubernetes-acceptance
          if-no-files-found: warn
          retention-days: 30
          path: |
            dist/linux/acceptance/kubernetes-acceptance.json
            dist/linux/acceptance/kubernetes-acceptance.log
