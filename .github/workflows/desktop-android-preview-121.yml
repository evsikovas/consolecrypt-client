name: macOS and Android 1.2.1 preview

on:
  push:
    branches: ['ci/desktop-preview-1.2.1-82033']

permissions:
  contents: read

jobs:
  macos:
    if: github.repository == 'evsikovas/consolecrypt-client'
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CC_BUILD_NUMBER: '82033'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: false
          persist-credentials: false
      - name: Native toolchain
        run: source client/scripts/ci-macos-tools.sh --xcode
      - name: Build universal macOS preview
        shell: bash
        run: |
          git restore --source=HEAD -- client/flutter/pubspec.yaml client/flutter/lib/app/app_info.dart
          bash client/scripts/build-macos.sh
      - name: Verify the disk image and both architectures
        shell: bash
        run: |
          set -euo pipefail
          cd dist/macos
          version=$(cat ConsoleCrypt.version)
          [[ "$version" == '1.2.1+82033' ]]
          codesign --verify --deep --strict ConsoleCrypt.app
          for binary in ConsoleCrypt.app/Contents/MacOS/ConsoleCrypt \
                        ConsoleCrypt.app/Contents/Frameworks/cc_bridge.framework/Versions/A/cc_bridge \
                        ConsoleCrypt.app/Contents/Helpers/consolecrypt-cli; do
            archs=" $(lipo -archs "$binary") "
            printf '%s:%s\n' "$binary" "$archs"
            [[ "$archs" == *' arm64 '* && "$archs" == *' x86_64 '* ]]
          done
          hdiutil verify ConsoleCrypt.dmg
          package="ConsoleCrypt-$version-macos-universal.dmg"
          cp ConsoleCrypt.dmg "$package"
          shasum -a 256 "$package" > SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-preview-82033
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/macos/ConsoleCrypt-1.2.1+82033-macos-universal.dmg
            dist/macos/SHA256SUMS-macos.txt
            dist/macos/ConsoleCrypt.version

  android:
    if: github.repository == 'evsikovas/consolecrypt-client'
    runs-on: [self-hosted, macOS, ARM64, consolecrypt, client]
    timeout-minutes: 180
    env:
      CC_BUILD_NUMBER: '82033'
      CARGO_BUILD_JOBS: '3'
      ANDROID_HOME: ${{ vars.ANDROID_HOME }}
      JAVA_HOME: ${{ vars.JAVA_HOME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: false
          persist-credentials: false
      - name: Native toolchain
        run: source client/scripts/ci-macos-tools.sh
      - name: Build signed ARM64 APK
        shell: bash
        run: |
          git restore --source=HEAD -- client/flutter/pubspec.yaml client/flutter/lib/app/app_info.dart
          caffeinate -i bash client/scripts/build-android.sh
      - name: Verify APK version and create the checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist/android
          version=$(cat ConsoleCrypt.version)
          [[ "$version" == '1.2.1+82033' ]]
          aapt="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}/build-tools/36.0.0/aapt"
          badging=$("$aapt" dump badging ConsoleCrypt-android-arm64.apk)
          grep -F "versionCode='82033' versionName='1.2.1'" <<< "$badging"
          package="ConsoleCrypt-$version-android-arm64.apk"
          cp ConsoleCrypt-android-arm64.apk "$package"
          shasum -a 256 "$package" > SHA256SUMS-android.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-preview-82033
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/android/ConsoleCrypt-1.2.1+82033-android-arm64.apk
            dist/android/SHA256SUMS-android.txt
            dist/android/ConsoleCrypt.version
