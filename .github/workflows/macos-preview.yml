name: macOS preview build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consolecrypt-macos-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    if: github.repository == 'evsikovas/consolecrypt-client' && github.ref == 'refs/heads/ci/desktop-preview-67028'
    runs-on: [self-hosted, macOS, ARM64, consolecrypt, client]
    timeout-minutes: 12
    steps:
      # Keep the previous job's verified build. A checkout would clean dist/.
      - name: Verify packages from the completed build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_NAME" == 'cc-macos-arm64' ]]
          [[ "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" == '7f456a29617e50a4bc96e47e21ef55fb5cc28471' ]]
          cd "$GITHUB_WORKSPACE/dist/macos"
          version=$(cat ConsoleCrypt.version)
          [[ "$version" == '1.2.0+67028' ]]
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          build_start = datetime.fromisoformat('2026-11-17T20:13:40+00:00')
          build_end = datetime.fromisoformat('2026-11-17T21:14:24+00:00')
          for name in ('ConsoleCrypt.dmg', 'ConsoleCrypt-macos.zip', 'ConsoleCrypt.version'):
              path = Path(name)
              stamp = datetime.fromtimestamp(path.stat().st_mtime, timezone.utc)
              if path.is_symlink() or not path.is_file() or not build_start <= stamp <= build_end:
                  raise SystemExit(f'File is outside the completed build: {name} ({stamp})')
          PY
          codesign --verify --deep --strict ConsoleCrypt.app
          short=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' ConsoleCrypt.app/Contents/Info.plist)
          build=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' ConsoleCrypt.app/Contents/Info.plist)
          [[ "$short+$build" == "$version" ]]
          for binary in ConsoleCrypt.app/Contents/MacOS/ConsoleCrypt ConsoleCrypt.app/Contents/Frameworks/cc_bridge.framework/Versions/A/cc_bridge; do
            archs=" $(lipo -archs "$binary") "
            [[ "$archs" == *' arm64 '* && "$archs" == *' x86_64 '* ]]
            printf '%s:%s\n' "$binary" "$archs"
          done
          shasum -a 256 -c ConsoleCrypt.dmg.sha256
          hdiutil verify ConsoleCrypt.dmg
          unzip -tq ConsoleCrypt-macos.zip
          cp ConsoleCrypt.dmg "ConsoleCrypt-$version-macos-universal-preview.dmg"
          cp ConsoleCrypt-macos.zip "ConsoleCrypt-$version-macos-universal.zip"
          shasum -a 256 "ConsoleCrypt-$version-macos-universal-preview.dmg" "ConsoleCrypt-$version-macos-universal.zip" > SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-preview-67028
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            dist/macos/ConsoleCrypt-1.2.0+67028-macos-universal-preview.dmg
            dist/macos/ConsoleCrypt-1.2.0+67028-macos-universal.zip
            dist/macos/ConsoleCrypt.version
            dist/macos/SHA256SUMS-macos.txt
