name: macOS preview build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consolecrypt-macos-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    if: github.repository == 'evsikovas/consolecrypt-client' && github.ref == 'refs/heads/ci/desktop-preview-67028'
    runs-on: [self-hosted, macOS, ARM64, consolecrypt, client]
    timeout-minutes: 120
    env:
      CC_BUILD_NUMBER: '67028'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native toolchain
        run: source client/scripts/ci-macos-tools.sh --xcode
      - name: Build universal preview
        run: bash client/scripts/build-macos.sh --no-cli
      - name: Verify and name packages
        shell: bash
        run: |
          set -euo pipefail
          cd dist/macos
          version=$(cat ConsoleCrypt.version)
          [[ "$version" == '1.2.0+67028' ]]
          codesign --verify --deep --strict ConsoleCrypt.app
          lipo -verify_arch arm64 x86_64 ConsoleCrypt.app/Contents/MacOS/ConsoleCrypt
          lipo -verify_arch arm64 x86_64 ConsoleCrypt.app/Contents/Frameworks/cc_bridge.framework/Versions/A/cc_bridge
          hdiutil verify ConsoleCrypt.dmg
          unzip -tq ConsoleCrypt-macos.zip
          mv ConsoleCrypt.dmg "ConsoleCrypt-$version-macos-universal-preview.dmg"
          mv ConsoleCrypt-macos.zip "ConsoleCrypt-$version-macos-universal.zip"
          shasum -a 256 "ConsoleCrypt-$version-macos-universal-preview.dmg" "ConsoleCrypt-$version-macos-universal.zip" > SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-preview-67028
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            dist/macos/ConsoleCrypt-1.2.0+67028-macos-universal-preview.dmg
            dist/macos/ConsoleCrypt-1.2.0+67028-macos-universal.zip
            dist/macos/ConsoleCrypt.version
            dist/macos/SHA256SUMS-macos.txt
