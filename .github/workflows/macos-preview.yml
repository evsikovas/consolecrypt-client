name: macOS preview build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consolecrypt-macos-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-runner-smoke:
    if: github.repository == 'evsikovas/consolecrypt-client' && github.ref_name == 'ci/desktop-preview-67035'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and exercise the native Runner
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          test "$(uname -m)" = arm64
          python=/opt/homebrew/bin/python3.12
          test -x "$python" || brew install python@3.12
          "$python" -IB - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          root = Path('runner')
          src = root / 'src/consolecrypt_runner'
          files = {path.relative_to(root).as_posix(): path.read_text(encoding='utf-8')
                   for path in src.rglob('*') if path.suffix in ('.py', '.json') and path.is_file()}
          name = 'requirements-darwin-arm64-py312.lock'
          files[name] = (root / name).read_text(encoding='utf-8')
          with subprocess.Popen([sys.executable, '-IB', str(root / 'setup/environment.py')],
                                stdin=subprocess.PIPE, stdout=subprocess.PIPE) as installer:
              installer.stdin.write(json.dumps({'action': 'install', 'files': files}).encode() + b'\n')
              installer.stdin.flush()
              response = json.loads(installer.stdout.readline(65536))
              status = installer.wait(timeout=10)
          if status or not response['ok']:
              raise SystemExit(response.get('error', 'native_runner_install_failed'))
          paths = response['result']['paths']
          subprocess.run([paths['python'], '-B', '-m', 'unittest', 'discover',
                          '-s', 'runner/tests', '-p', 'test_macos_runner.py', '-v'],
                         env={**os.environ, 'PYTHONPATH': paths['module_dir']},
                         check=True, timeout=180)
          PY

  macos:
    needs: native-runner-smoke
    if: github.repository == 'evsikovas/consolecrypt-client' && github.ref_name == 'ci/desktop-preview-67035'
    runs-on: [self-hosted, macOS, ARM64, consolecrypt, client]
    timeout-minutes: 120
    env:
      CC_BUILD_NUMBER: '67035'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native toolchain
        run: source client/scripts/ci-macos-tools.sh --xcode
      - name: Build universal preview
        run: bash client/scripts/build-macos.sh --no-cli
      - name: Verify and name packages
        shell: bash
        run: |
          set -euo pipefail
          cd dist/macos
          version=$(cat ConsoleCrypt.version)
          [[ "$version" == '1.2.0+67035' ]]
          codesign --verify --deep --strict ConsoleCrypt.app
          for binary in ConsoleCrypt.app/Contents/MacOS/ConsoleCrypt ConsoleCrypt.app/Contents/Frameworks/cc_bridge.framework/Versions/A/cc_bridge; do
            archs=" $(lipo -archs "$binary") "
            [[ "$archs" == *' arm64 '* && "$archs" == *' x86_64 '* ]]
          done
          hdiutil verify ConsoleCrypt.dmg
          unzip -tq ConsoleCrypt-macos.zip
          mv ConsoleCrypt.dmg "ConsoleCrypt-$version-macos-universal-preview.dmg"
          mv ConsoleCrypt-macos.zip "ConsoleCrypt-$version-macos-universal.zip"
          shasum -a 256 "ConsoleCrypt-$version-macos-universal-preview.dmg" "ConsoleCrypt-$version-macos-universal.zip" > SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-preview-67035
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            dist/macos/ConsoleCrypt-1.2.0+67035-macos-universal-preview.dmg
            dist/macos/ConsoleCrypt-1.2.0+67035-macos-universal.zip
            dist/macos/ConsoleCrypt.version
            dist/macos/SHA256SUMS-macos.txt
