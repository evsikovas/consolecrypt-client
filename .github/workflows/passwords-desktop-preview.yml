name: macOS password manager preview

on:
  push:
    branches: ['ci/passwords-desktop-82031']

permissions:
  contents: read

jobs:
  macos:
    if: github.repository == 'evsikovas/consolecrypt-client'
    runs-on: [self-hosted, macOS, ARM64, consolecrypt, client]
    timeout-minutes: 180
    env:
      CC_BUILD_NUMBER: '82031'
      CARGO_BUILD_JOBS: '3'
      CC_CODESIGN_IDENTITY: ${{ vars.CC_CODESIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: false
          persist-credentials: false
      - name: Native toolchain
        run: source client/scripts/ci-macos-tools.sh --xcode
      - name: Build universal macOS preview
        run: bash client/scripts/build-macos.sh
      - name: Verify the disk image and both architectures
        shell: bash
        run: |
          set -euo pipefail
          cd dist/macos
          version=$(cat ConsoleCrypt.version)
          [[ "$version" == '1.2.0+82031' ]]
          codesign --verify --deep --strict ConsoleCrypt.app
          for binary in ConsoleCrypt.app/Contents/MacOS/ConsoleCrypt ConsoleCrypt.app/Contents/Frameworks/cc_bridge.framework/Versions/A/cc_bridge; do
            lipo -verify_arch arm64 x86_64 "$binary"
          done
          hdiutil verify ConsoleCrypt.dmg
          package="ConsoleCrypt-$version-macos-universal.dmg"
          mv ConsoleCrypt.dmg "$package"
          shasum -a 256 "$package" > SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-preview-82031
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/macos/ConsoleCrypt-1.2.0+82031-macos-universal.dmg
            dist/macos/SHA256SUMS-macos.txt
            dist/macos/ConsoleCrypt.version
