name: Signed update feeds

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  dispatch-main:
    if: github.repository == 'evsikovas/consolecrypt-client' && github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # A release event uses a tag ref. It cannot access the signing key here;
      # request a separate run whose workflow and scripts come from main.
      - name: Request trusted-main publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            repos/evsikovas/consolecrypt-client/actions/workflows/update-feeds.yml/dispatches \
            -f ref=main

  publish:
    if: github.repository == 'evsikovas/consolecrypt-client' && github.event.repository.default_branch == 'main' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: consolecrypt-signed-update-feeds
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Test publisher with ephemeral test keys
        run: node --test client/scripts/test_publish_update_feeds.mjs
      - name: Verify installers and renew signed feeds when due
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: node client/scripts/publish-update-feeds.mjs
