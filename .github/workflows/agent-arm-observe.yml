name: Agent ARM interpreter observation
on:
  push:
    branches: [ci/agent-arm64-observe-r17]
    paths: ['.github/workflows/agent-arm-observe.yml', '.github/fixtures/agent-installed/arm64_python_observe.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-arm-observe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    if: github.ref == 'refs/heads/ci/agent-arm64-observe-r17'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Observe fixed installer trust ancestry without changing the host
        timeout-minutes: 1
        shell: bash
        run: |
          /usr/bin/python3.12 -I -B - <<'PY'
          import json,os,stat,sys
          from pathlib import Path
          assert sys.platform=='linux' and os.uname().machine=='aarch64'
          fixed={'root':'/','etc':'/etc','trustDirectory':'/etc/consolecrypt-agent-release',
                 'trustDocument':'/etc/consolecrypt-agent-release/trust.json',
                 'trustKey':'/etc/consolecrypt-agent-release/public-key.json','usr':'/usr',
                 'usrLocal':'/usr/local','usrLocalLibexec':'/usr/local/libexec',
                 'verifierDirectory':'/usr/local/libexec/consolecrypt-agent-release',
                 'verifier':'/usr/local/libexec/consolecrypt-agent-release/cc-agent-identity',
                 'opt':'/opt','var':'/var','varCache':'/var/cache',
                 'candidateDirectory':'/var/cache/consolecrypt-agent','home':'/home',
                 'runnerHome':'/home/runner','runnerWork':'/home/runner/work','runnerTemp':'/home/runner/work/_temp'}
          rows={}
          for label,path in fixed.items():
              try:
                  info=Path(path).lstat()
                  rows[label]=dict(exists=True,uid=info.st_uid,gid=info.st_gid,mode=stat.S_IMODE(info.st_mode),
                      links=info.st_nlink,directory=stat.S_ISDIR(info.st_mode),regular=stat.S_ISREG(info.st_mode),
                      symlink=stat.S_ISLNK(info.st_mode),rootOwnerNoGroupOtherWrite=info.st_uid==0 and not bool(info.st_mode&0o022))
              except FileNotFoundError:rows[label]=dict(exists=False)
              except OSError as error:rows[label]=dict(observationFailed=True,errno=error.errno)
          value=dict(format='cc-arm-fixed-trust-ancestor-observation/v1',readOnly=True,
              architecture=os.uname().machine,platform=sys.platform,observerUid=os.getuid(),observerEuid=os.geteuid(),
              compilerExecuted=False,serviceStarted=False,installedAcceptanceExecuted=False,
              independentRuntimePinApproval=False,fixedParents=rows)
          raw=json.dumps(value,sort_keys=True,separators=(',',':'))
          assert len(raw.encode())<=8192
          print('CC_AGENT_ARM_FIXED_TRUST_ANCESTORS '+raw,flush=True)
          PY
      - name: Observe the fixed interpreter without approving a runtime pin
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'a9679355bbd0da789129e649f14084c6942d226d16ea46d69c9a7cbd5aeb7cdd  .github/fixtures/agent-installed/arm64_python_observe.py' | sha256sum --check --strict
          /usr/bin/python3.12 -I -B .github/fixtures/agent-installed/arm64_python_observe.py --observe-only --output "$RUNNER_TEMP/cc-arm64-python-candidate.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agent-arm64-python-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/cc-arm64-python-candidate.json
