stages: [build]

# Requires a Windows shell runner with Flutter, Rust, C++, Perl, Python and Inno Setup.
# Manual by design: do not start expensive native builds on every source push.
build-windows:
  stage: build
  tags: [windows]
  when: manual
  allow_failure: true
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File client/scripts/build-windows.ps1 -Installer -NoCli
  artifacts:
    name: "ConsoleCrypt-windows-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/windows/*-setup.exe
      - dist/windows/*.sha256
      - dist/windows/ConsoleCrypt.version
    expire_in: 30 days
